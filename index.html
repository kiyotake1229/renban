<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>レンバン</title>
<meta name="theme-color" content="#14122B">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* ダークファースト。会場の暗さにペンライトの色が浮かぶイメージ */
:root{
  --bg:#14122B; --sf:#1E1B3D; --sf2:#2A2650; --sf3:#353065;
  --ink:#F2EEFF; --ink2:#B3ACD6; --ink3:#6F6A94; --line:#302C58;
  --amber:#FFC55C; --amber-ink:#2A1E00; --amber-soft:rgba(255,197,92,.14);
  --pink:#FF6FB0; --pink-soft:rgba(255,111,176,.14);
  --ok:#4ED7A2; --warn:#FF7A7A; --info:#7FB4FF;
  --shadow:0 16px 40px rgba(0,0,0,.45); --shadow-sm:0 4px 14px rgba(0,0,0,.3);
  --stub-notch:var(--bg);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F3F1FA; --sf:#FFFFFF; --sf2:#E9E6F5; --sf3:#DCD8EE;
    --ink:#1B1836; --ink2:#5A5580; --ink3:#9A96B8; --line:#E1DDF0;
    --amber:#E39A16; --amber-ink:#2A1E00; --amber-soft:rgba(227,154,22,.14);
    --pink:#D9418A; --pink-soft:rgba(217,65,138,.12);
    --ok:#1FA974; --warn:#D9534F; --info:#3B7DD8;
    --shadow:0 16px 40px rgba(27,24,54,.14); --shadow-sm:0 4px 14px rgba(27,24,54,.08);
    --stub-notch:var(--bg);
  }
}
:root[data-theme="light"]{
  --bg:#F3F1FA; --sf:#FFFFFF; --sf2:#E9E6F5; --sf3:#DCD8EE;
  --ink:#1B1836; --ink2:#5A5580; --ink3:#9A96B8; --line:#E1DDF0;
  --amber:#E39A16; --amber-ink:#2A1E00; --amber-soft:rgba(227,154,22,.14);
  --pink:#D9418A; --pink-soft:rgba(217,65,138,.12);
  --ok:#1FA974; --warn:#D9534F; --info:#3B7DD8;
  --shadow:0 16px 40px rgba(27,24,54,.14); --shadow-sm:0 4px 14px rgba(27,24,54,.08);
  --stub-notch:var(--bg);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
svg{display:block}
.d{font-family:"Barlow Condensed","Zen Kaku Gothic New",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- shell ---------- */
#app{height:100dvh;max-width:430px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
@media(min-width:700px){
  body{background:var(--sf2)}
  #app{height:min(880px,calc(100dvh - 32px));margin-top:16px;border-radius:36px;box-shadow:var(--shadow);border:1px solid var(--line)}
}
.screen{flex:1;display:none;flex-direction:column;min-height:0}
.screen.active{display:flex}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 8px;gap:10px}
.top h1{font-size:19px;font-weight:700}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px}
.brand .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--amber),var(--pink));display:grid;place-items:center}
.brand .mark svg{width:18px;height:18px;stroke:#1B1836;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.scroll{flex:1;overflow-y:auto;min-height:0;padding:0 16px 24px}
.label{font-family:"Barlow Condensed",sans-serif;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin:16px 4px 8px;display:flex;align-items:center;gap:8px}
.label b{color:var(--amber);font-weight:600}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);transition:background .2s,transform .2s;flex:none}
.iconbtn:hover{background:var(--sf2)}
.iconbtn:active{transform:scale(.92)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:5px 10px;border-radius:999px;background:var(--sf2);color:var(--ink2);white-space:nowrap}
.chip.ok{background:rgba(78,215,162,.15);color:var(--ok)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.pink{background:var(--pink-soft);color:var(--pink)}
.chip.warn{background:rgba(255,122,122,.15);color:var(--warn)}
.chip.info{background:rgba(127,180,255,.15);color:var(--info)}
.chip .ico{width:13px;height:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:13px;font-weight:700;background:var(--amber);color:var(--amber-ink);transition:transform .15s,filter .2s,background .2s;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--sf2);color:var(--ink)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink2)}
.btn.danger{background:transparent;border:1px solid var(--line);color:var(--warn)}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn .ico{width:16px;height:16px}

/* ---------- tab bar ---------- */
nav.tabs{display:flex;justify-content:space-around;align-items:center;padding:8px 8px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--sf)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--ink3);padding:6px 12px;border-radius:14px;position:relative;transition:color .2s}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
nav.tabs button.on{color:var(--amber)}
nav.tabs button.on svg{transform:translateY(-2px) scale(1.08)}
.badge{position:absolute;top:2px;right:6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--pink);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}

/* ---------- ticket stub ---------- */
.ticket{position:relative;display:flex;background:var(--sf);border-radius:18px;box-shadow:var(--shadow-sm);overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;border:1px solid var(--line)}
.ticket:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.ticket .stub{width:82px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 8px;border-right:2px dashed var(--line);position:relative;color:var(--ink)}
.ticket .stub::before,.ticket .stub::after{content:"";position:absolute;right:-9px;width:16px;height:16px;border-radius:50%;background:var(--stub-notch);border:1px solid var(--line)}
.ticket .stub::before{top:-9px}.ticket .stub::after{bottom:-9px}
.ticket .stub .mo{font-family:"Barlow Condensed",sans-serif;font-size:12px;letter-spacing:.14em;color:var(--ink3);font-weight:600}
.ticket .stub .dd{font-family:"Barlow Condensed",sans-serif;font-size:36px;font-weight:700;line-height:1}
.ticket .stub .wd{font-size:11px;color:var(--ink2);margin-top:2px}
.ticket .body{flex:1;min-width:0;padding:12px 14px 12px 16px;display:flex;flex-direction:column;gap:5px}
.ticket .artist{font-family:"Barlow Condensed",sans-serif;font-size:19px;font-weight:700;letter-spacing:.02em;line-height:1.1;display:flex;align-items:center;gap:8px}
.ticket .artist i{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
.ticket .tour{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticket .venue{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:4px}
.ticket .venue .ico{width:13px;height:13px}
.ticket .foot{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.ticket.mine .stub{background:linear-gradient(160deg,var(--amber-soft),transparent)}
.ticket.done .stub{background:linear-gradient(160deg,rgba(78,215,162,.18),transparent)}

.stack{display:flex;flex-direction:column;gap:10px}
.empty{padding:36px 20px;text-align:center;color:var(--ink2);font-size:13.5px;line-height:1.7}
.empty .ico{width:40px;height:40px;margin:0 auto 10px;stroke:var(--ink3);stroke-width:1.5}

/* ---------- event page (overlay) ---------- */
.page{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:5}
.page.open{display:flex;transform:translateX(0)}
.ev-hero{padding:8px 20px 16px;background:linear-gradient(180deg,var(--sf) 0%,var(--bg) 100%);border-bottom:1px solid var(--line)}
.ev-hero .artist{font-family:"Barlow Condensed",sans-serif;font-size:30px;font-weight:700;line-height:1;letter-spacing:.02em;display:flex;align-items:center;gap:10px;text-wrap:balance}
.ev-hero .artist i{width:10px;height:10px;border-radius:50%;box-shadow:0 0 10px currentColor;flex:none}
.ev-hero .tour{color:var(--ink2);font-size:13.5px;margin-top:4px}
.ev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.ev-grid div{background:var(--sf2);border-radius:12px;padding:8px 10px}
.ev-grid small{display:block;font-size:10.5px;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase;font-family:"Barlow Condensed",sans-serif;font-weight:600}
.ev-grid b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:19px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mystatus{display:flex;align-items:center;gap:10px;margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--sf);border:1px solid var(--line)}
.mystatus .txt{flex:1;font-size:13px;color:var(--ink2)}
.mystatus .txt b{display:block;color:var(--ink);font-size:14px}
.seg{display:flex;background:var(--sf2);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 10px;border-radius:8px;font-size:12px;color:var(--ink2);transition:all .15s}
.seg button.on{background:var(--sf);color:var(--ink);box-shadow:var(--shadow-sm)}

/* ---------- ホーム：カウントダウン・予定・手帳 ---------- */
.homeseg{margin:0 16px 8px;align-self:stretch}
.homeseg button{flex:1;padding:8px}
.hero{position:relative;overflow:hidden;border-radius:20px;padding:18px 18px 16px;color:#fff;background:radial-gradient(120% 100% at 100% 0%,#5B3FB0 0%,#2A1E63 55%,#1A1640 100%);box-shadow:var(--shadow-sm);cursor:pointer;margin-top:4px}
.hero .eyebrow{font-family:"Barlow Condensed",sans-serif;font-size:12px;letter-spacing:.18em;color:var(--amber);font-weight:600;text-transform:uppercase}
.hero .cd{display:flex;align-items:baseline;gap:6px;margin:2px 0 4px}
.hero .cd b{font-family:"Barlow Condensed",sans-serif;font-size:56px;font-weight:700;line-height:1;letter-spacing:-.01em}
.hero .cd span{font-size:14px;opacity:.85}
.hero .what{font-size:14px;font-weight:700}
.hero .sub{font-size:12.5px;opacity:.8;margin-top:2px}
.hero .glow{position:absolute;right:-30px;bottom:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,197,92,.45),transparent 65%);pointer-events:none}
.hero .sticks{position:absolute;left:0;right:0;bottom:-6px;display:flex;justify-content:space-around;pointer-events:none}
.hero .sticks i{width:4px;height:18px;border-radius:2px;background:currentColor;box-shadow:0 0 8px currentColor;animation:wave 2.8s ease-in-out infinite;opacity:.8}
.sched{display:flex;flex-direction:column;gap:6px}
.sched .it{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--sf);border:1px solid var(--line);border-radius:14px}
.sched .d{width:44px;flex:none;text-align:center;font-family:"Barlow Condensed",sans-serif;line-height:1}
.sched .d b{display:block;font-size:20px;font-weight:700}
.sched .d span{font-size:10.5px;color:var(--ink3);letter-spacing:.08em}
.sched .t{flex:1;min-width:0}
.sched .t b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sched .t span{font-size:11.5px;color:var(--ink2);display:flex;align-items:center;gap:5px}
.sched .t span i{width:6px;height:6px;border-radius:50%;flex:none}
.sched .k{font-size:10.5px;padding:3px 8px;border-radius:999px;background:var(--sf2);color:var(--ink2);flex:none;font-weight:600}
.sched .k.hot{background:var(--pink-soft);color:var(--pink)}
.sched .k.soon{background:var(--amber-soft);color:var(--amber)}
.sched .it.urgent{border-color:var(--pink)}
.diary-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 6px}
.drow{display:flex;gap:12px;padding:12px;background:var(--sf);border:1px solid var(--line);border-radius:16px;cursor:pointer;transition:transform .2s}
.drow:hover{transform:translateY(-2px)}
.drow .d{width:44px;flex:none;text-align:center;font-family:"Barlow Condensed",sans-serif;line-height:1;padding-top:2px}
.drow .d b{display:block;font-size:22px;font-weight:700}
.drow .d span{font-size:10.5px;color:var(--ink3);letter-spacing:.08em}
.drow .t{flex:1;min-width:0}
.drow .t b{display:block;font-size:14.5px;font-family:"Barlow Condensed",sans-serif;font-size:17px;letter-spacing:.02em}
.drow .t span{display:block;font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .t p{font-size:12.5px;color:var(--ink);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.drow .foot{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.stars{display:inline-flex;gap:2px;color:var(--amber)}
.stars svg{width:13px;height:13px;fill:currentColor;stroke:none}
.stars svg.off{fill:var(--line)}
.starpick{display:flex;gap:6px}
.starpick button svg{width:28px;height:28px;fill:var(--line);stroke:none;transition:fill .15s,transform .15s}
.starpick button.on svg{fill:var(--amber)}
.starpick button:hover svg{transform:scale(1.15)}
.costgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.costgrid .field{margin-bottom:0}
.costgrid input{text-align:right;font-family:"Barlow Condensed",sans-serif;font-size:16px}
.yen{font-family:"Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}

/* ---------- X連携 ---------- */
.xlink{display:inline-flex;align-items:center;gap:3px;color:var(--ink2)}
.xlink .ico{width:12px;height:12px;fill:currentColor;stroke:none}
.xcard{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--sf);border:1px solid var(--line);margin-bottom:14px}
.xcard .ico{width:22px;height:22px;fill:var(--ink);stroke:none;flex:none}
.xcard b{display:block;font-size:13.5px}
.xcard span{font-size:12px;color:var(--ink2)}
.xcard.off{opacity:.7;border-style:dashed}
.xpreview{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:13.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.xpreview .tag{color:var(--info)}
#b-xpost .ico{fill:var(--amber-ink);stroke:none;width:14px;height:14px}
.parsed{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.parsed span{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--amber-soft);color:var(--amber)}
.parsed span.ev{background:var(--pink-soft);color:var(--pink)}

/* ---------- 検索 ---------- */
.searchbox{display:flex;align-items:center;gap:8px;background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:4px 6px 4px 14px;margin:4px 0 6px}
.searchbox .ico{color:var(--ink3);width:18px;height:18px}
.searchbox input{flex:1;border:0;background:transparent;outline:none;padding:9px 0;font-size:14px}
.searchbox button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--ink3)}
.searchbox button .ico{width:14px;height:14px}
.frow{display:flex;align-items:flex-start;gap:8px;padding:6px 0}
.frow>label{flex:none;width:52px;font-size:11px;letter-spacing:.06em;color:var(--ink3);font-weight:600;padding-top:8px;font-family:"Barlow Condensed",sans-serif;text-transform:uppercase}
.frow .opts{flex:1}
.frow .opts button{padding:6px 10px;font-size:12px}
.frow .opts button i{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px}
.sres{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 4px 8px}
.sres .label{margin:0}
.sortsel{font-size:12px;background:var(--sf);border:1px solid var(--line);border-radius:999px;padding:5px 10px;color:var(--ink2);outline:none}
.ticket .foot .fit{background:rgba(78,215,162,.15);color:var(--ok)}
.ticket .kind{font-size:10.5px;letter-spacing:.08em;color:var(--ink3);font-family:"Barlow Condensed",sans-serif;font-weight:600;text-transform:uppercase}
.savedrow{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--sf);border:1px solid var(--line);border-radius:14px;cursor:pointer;margin-bottom:8px}
.savedrow .ico{color:var(--amber);width:18px;height:18px}
.savedrow .t{flex:1;min-width:0}
.savedrow b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.savedrow span{font-size:12px;color:var(--ink2)}
.savedrow .n{font-family:"Barlow Condensed",sans-serif;font-size:18px;font-weight:700;color:var(--amber)}
.savedrow .x{color:var(--ink3);width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.savedrow .x .ico{width:14px;height:14px;color:inherit}

/* ---------- 条件バー ---------- */
.condbar{margin:12px 16px 0;padding:12px 14px;background:var(--sf);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;gap:8px}
.condhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.condtitle{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700}
.condtitle .ico{width:16px;height:16px;color:var(--amber)}
.condtitle b{font-family:"Barlow Condensed",sans-serif;font-size:16px;color:var(--amber)}
.condtitle em{font-style:normal;font-size:11px;color:var(--pink);background:var(--pink-soft);padding:2px 7px;border-radius:999px;font-weight:500}
.condchips{display:flex;flex-wrap:wrap;gap:5px}
.condchips span{font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--amber-soft);color:var(--amber)}
.condchips span.none{background:var(--sf2);color:var(--ink3)}
.condtoggle{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);cursor:pointer}
.condtoggle input{width:16px;height:16px;accent-color:var(--amber)}
.condrow{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.condrow label{font-size:12.5px;color:var(--ink2);font-weight:500}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{font-size:12.5px;padding:6px 11px;border-radius:999px;background:var(--sf);border:1px solid var(--line);color:var(--ink2);transition:all .15s}
.opts button.on{background:var(--amber-soft);border-color:var(--amber);color:var(--amber);font-weight:700}
.score{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.score b{font-family:"Barlow Condensed",sans-serif;font-size:18px;font-weight:700}
.score span{font-size:9.5px;color:var(--ink3);letter-spacing:.06em}
.score.full b{color:var(--ok)}.score.mid b{color:var(--amber)}.score.low b{color:var(--ink3)}
.person .tags span.hit{background:var(--pink-soft);color:var(--pink)}
.person .tags span.miss{background:rgba(255,122,122,.14);color:var(--warn);text-decoration:line-through}

/* ---------- person card ---------- */
.person{display:flex;gap:12px;padding:14px;background:var(--sf);border:1px solid var(--line);border-radius:18px;cursor:pointer;transition:transform .2s,border-color .2s}
.person:hover{transform:translateY(-2px);border-color:var(--ink3)}
.person.matched{border-color:var(--ok)}
.avatar{width:50px;height:50px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px;color:#1B1836;position:relative;letter-spacing:.02em}

/* Xの募集文を貼り付けて構造化 */
function parseXPost(t){
  const r={found:[],cond:{},ticket:null,seat:'',method:'',ev:null};
  const norm=t.replace(/\s+/g,' ');
  // アーティスト・会場・日付から公演を推定
  let best=null;EVENTS.forEach(e=>{const a=A(e.a);let sc=0;if(norm.includes(a.name))sc+=3;if(a.lineup&&a.lineup.some(l=>norm.includes(l.replace(' 他',''))))sc+=1;if(norm.includes(e.venue.split(' ')[0]))sc+=3;if(norm.includes(e.city))sc+=1;
    const p=dparts(e.date);if(new RegExp(`(${p.m}/${p.d}|${p.m}月${p.d}日)`).test(norm))sc+=3;if(sc>(best?.sc||0))best={e,sc};});
  if(best&&best.sc>=3){r.ev=best.e;r.found.push('公演：'+A(best.e.a).name+' '+best.e.venue);}
  if(/2枚|２枚|1枚余|１枚余|譲/.test(norm)){r.ticket='two';r.found.push('2枚持ち（1枚譲れる）');}
  else if(/1枚|１枚|単番|隣/.test(norm)){r.ticket='one';r.found.push('1枚持ち');}
  else if(/求|探して|申込|同行|名義/.test(norm)){r.ticket='none';r.found.push('チケットなし');}
  const seat=norm.match(/(アリーナ|スタンド|[SA]席|1階|2階|整理番号\s?[A-C]?\s?\d*番?台?)/);if(seat){r.seat=seat[1];r.found.push('席：'+seat[1]);}
  if(/電子|分配|QR/.test(norm)){r.method='digital';r.found.push('電子分配');}else if(/手渡し|当日渡/.test(norm)){r.method='hand';r.found.push('手渡し');}
  if(/同性|女性のみ|女性限定|男性のみ|男性限定/.test(norm)){r.cond.gender='same';r.found.push('同性のみ');}
  if(/本人確認|身分証/.test(norm)){r.cond.verified='yes';r.found.push('本人確認済');}
  if(/FC|ファンクラブ|会員/.test(norm)){r.cond.fc='yes';r.found.push('FC会員');}
  if(/未成年|18歳以上|20歳以上|成人/.test(norm)){r.cond.minor='no';r.found.push('未成年除外');}
  if(/物販|グッズ/.test(norm)){r.cond.goods=/並ば(ない|ず)|行かない/.test(norm)?'no':'yes';r.found.push(r.cond.goods==='yes'?'物販並ぶ':'物販行かない');}
  if(/声出し|コール|盛り上が/.test(norm)){r.cond.voice='loud';r.found.push('声出し全力');}
  else if(/静か|座って|着席/.test(norm)){r.cond.voice='quiet';r.found.push('静かに聴く');}
  if(/打ち上げ|飲み|感想会/.test(norm)){r.cond.after='yes';r.found.push('打ち上げ');}else if(/即帰|解散/.test(norm)){r.cond.after='no';r.found.push('終演後すぐ解散');}
  if(/遠征/.test(norm)){r.cond.travel='yes';r.found.push('遠征組');}
  if(/初心者|初めて|初参戦/.test(norm)){r.cond.beginner='any';r.found.push('初心者OK');}
  if(/ホテル|宿/.test(norm)){r.cond.hotel='yes';r.found.push('ホテルシェア');}
  return r;
}

/* ================= 公演検索 ================= */
function periodRange(p){
  const y=TODAY.getFullYear(),m=TODAY.getMonth();const d=n=>new Date(y,m,TODAY.getDate()+n);
  const iso=isoOf;
  if(p==='week')return [iso(TODAY),iso(d(7))];
  if(p==='month')return [iso(TODAY),iso(new Date(y,m+1,0))];
  if(p==='next')return [iso(new Date(y,m+1,1)),iso(new Date(y,m+2,0))];
  if(p==='3m')return [iso(TODAY),iso(d(92))];
  if(/^\d{4}-\d{2}$/.test(p)){const [yy,mm]=p.split('-').map(Number);return [iso(new Date(yy,mm-1,1)),iso(new Date(yy,mm,0))];}
  return null;
}
function periodLabel(p){const m=TODAY.getMonth()+1;const mm=/^\d{4}-(\d{2})$/.exec(p);return mm?(+mm[1])+'月':{all:'すべて',week:'今週',month:`今月（${m}月）`,next:`来月（${m%12+1}月）`,'3m':'3か月以内'}[p]||p;}
const PERIODS=['all','week','month','next','3m',...[2,3].map(k=>{const d=new Date(TODAY.getFullYear(),TODAY.getMonth()+k,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');})];
function searchEvents(q){
  const t=(q.text||'').trim().toLowerCase();const r=periodRange(q.period);
  return EVENTS.filter(e=>{const a=A(e.a);
    if(t&&![a.name,e.tour,e.venue,e.city,a.genre,e.kind,...(a.lineup||[])].join(' ').toLowerCase().includes(t))return false;
    if(q.genre.length&&!q.genre.includes(a.genre))return false;
    if(q.kind.length&&!q.kind.includes(e.kind))return false;
    if(q.region.length&&!q.region.includes(e.region))return false;
    if(q.vt.length&&!q.vt.includes(e.vt))return false;
    if(r&&(e.date<r[0]||e.date>r[1]))return false;
    if(q.seek&&!peopleFor(e.id).length)return false;
    if(q.give&&!peopleFor(e.id).some(u=>u.tickets[e.id]==='two'))return false;
    return e.date>=TODAY_ISO;
  }).sort((x,y)=>q.sort==='seek'?peopleFor(y.id).length-peopleFor(x.id).length:q.sort==='fit'?fitCount(y.id)-fitCount(x.id):x.date<y.date?-1:1);
}
function searchSummary(q){const o=[];if(q.text)o.push('「'+q.text+'」');if(q.genre.length)o.push(q.genre.join('/'));if(q.kind.length)o.push(q.kind.join('/'));if(q.period!=='all')o.push(periodLabel(q.period));if(q.region.length)o.push(q.region.join('/'));if(q.vt.length)o.push(q.vt.join('/'));if(q.seek)o.push('募集あり');if(q.give)o.push('譲れる人あり');return o;}
function renderSearch(){
  const q=S.search;const res=searchEvents(q);
  const multi=(k,list,dot)=>`<div class="opts" data-k="${k}">${list.map(v=>`<button type="button" data-v="${esc(v)}" class="${q[k].includes(v)?'on':''}">${dot?`<i style="background:hsl(${ARTISTS.find(a=>a.genre===v)?.hue||0} 90% 65%)"></i>`:''}${v}</button>`).join('')}</div>`;
  $('#search').innerHTML=`<div class="searchbox">${ICON.search}<input id="q-text" value="${esc(q.text)}" placeholder="アーティスト・ツアー名・会場・出演者"><button id="q-clear" ${q.text?'':'hidden'}>${ICON.close}</button></div>
    <div class="frow"><label>Genre</label>${multi('genre',GENRES,true)}</div>
    <div class="frow"><label>Type</label>${multi('kind',KINDS)}</div>
    <div class="frow"><label>When</label><div class="opts" data-k="period">${PERIODS.map(p=>`<button type="button" data-v="${p}" class="${q.period===p?'on':''}">${periodLabel(p)}</button>`).join('')}</div></div>
    <div class="frow"><label>Area</label>${multi('region',REGIONS)}</div>
    <div class="frow"><label>Venue</label>${multi('vt',VTYPES)}</div>
    <div class="frow"><label>People</label><div class="opts"><button type="button" data-t="seek" class="${q.seek?'on':''}">${ICON.users}連番募集あり</button><button type="button" data-t="give" class="${q.give?'on':''}">${ICON.ticket}譲れる人がいる</button></div></div>
    <div class="sres"><div class="label">${res.length}件の公演</div><div style="display:flex;gap:6px;align-items:center"><select class="sortsel" id="q-sort"><option value="date" ${q.sort==='date'?'selected':''}>日付順</option><option value="seek" ${q.sort==='seek'?'selected':''}>募集人数順</option><option value="fit" ${q.sort==='fit'?'selected':''}>条件に合う人が多い順</option></select><button class="btn sm" id="q-save">${ICON.bookmark}保存</button></div></div>
    <div class="stack">${res.length?res.map(e=>{const n=peopleFor(e.id).length,f=fitCount(e.id);const a=A(e.a);
      return ticketHTML(e,S.attending[e.id]?'mine':'',`${S.attending[e.id]?`<span class="chip amber">${ICON.check}参戦予定</span>`:''}<span class="chip">${ICON.users}募集 ${n}人</span>${f?`<span class="chip fit">条件に合う ${f}人</span>`:''}<span class="chip">${e.region} · ${e.vt}</span>${a.lineup?`<span class="chip">${a.lineup.slice(0,2).join(' / ')} …</span>`:''}`);}).join(''):`<div class="empty">${ICON.search}この条件の公演はありません。<br>条件をゆるめるか、検索を保存しておくと新着で追加されたときに分かります。</div>`}</div>`;
  const root=$('#search');
  const qt=$('#q-text');qt.oninput=()=>{q.text=qt.value;save();const pos=qt.selectionStart;renderSearch();const n=$('#q-text');n.focus();n.setSelectionRange(pos,pos);};
  $('#q-clear').onclick=()=>{q.text='';save();renderSearch();};
  root.querySelectorAll('.opts[data-k]').forEach(o=>o.querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=o.dataset.k,v=b.dataset.v;
    if(k==='period')q.period=v;else{const i=q[k].indexOf(v);i>=0?q[k].splice(i,1):q[k].push(v);}save();renderSearch();}));
  root.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{q[b.dataset.t]=!q[b.dataset.t];save();renderSearch();});
  $('#q-sort').onchange=e=>{q.sort=e.target.value;save();renderSearch();};
  $('#q-save').onclick=async()=>{const name=await askDialog({title:'この検索に名前をつける',desc:'ホームに新着件数つきで並びます。',input:true,value:searchSummary(q).join(' · ')||'すべての公演',ok:'保存'});if(!name)return;S.savedSearches.push({name,q:JSON.parse(JSON.stringify(q))});save();toast('検索を保存しました。ホームに新着件数つきで表示されます');};
  root.querySelectorAll('.ticket').forEach(t=>t.onclick=()=>openEvent(t.dataset.ev));
}
$('#b-search-clear').onclick=()=>{S.search={text:'',genre:[],kind:[],period:'all',region:[],vt:[],seek:false,give:false,sort:'date'};save();renderSearch();};

/* ================= 公演ページ ================= */
let curEv=null;
function openEvent(id){curEv=id;renderEvent();$('#p-event').classList.add('open');}
$('#b-ev-back').onclick=()=>{$('#p-event').classList.remove('open');showTab(tab);};
const METHOD={hand:'当日手渡し',digital:'電子チケット分配'};
function renderEvent(){
  const e=E(curEv),a=A(e.a),mine=S.attending[e.id],mt=S.myTicket[e.id]||{};
  const c=condFor(e.id);const isCustom=!!S.cond.byEvent[e.id];
  $('#ev-count').innerHTML=`${ICON.users}連番募集 ${peopleFor(e.id).length}人`;
  $('#ev-hero').innerHTML=`<div class="artist"><i style="color:hsl(${a.hue} 90% 65%);background:hsl(${a.hue} 90% 65%)"></i>${a.name}</div><div class="tour">${e.kind} · ${a.genre} · ${e.tour}${a.lineup?'<br>出演：'+a.lineup.join(' / '):''}</div>
    <div class="ev-grid"><div><small>Date</small><b>${fmtDate(e.date)}</b></div><div><small>Open / Start</small><b>${e.open} / ${e.start}</b></div><div><small>Venue</small><b>${e.venue}</b></div></div>
    <div class="mystatus">${S.done[e.id]?`<div class="txt"><b>終演済み</b>${U(S.done[e.id].uid).name}さんと連番 · ありがとう送信済み</div><button class="btn sm ghost" id="b-diary">${ICON.book}手帳を見る</button>`:mine?`<div class="txt"><b>自分の募集</b>${TICKET[mine].split('（')[0]}${mine!=='none'&&mt.seat?' · '+mt.seat:''}${mine!=='none'&&mt.method?' · '+METHOD[mt.method]:''}</div><button class="btn sm ghost" id="b-mytk">編集</button><button class="btn sm" id="b-xpost" title="Xに募集を投稿">${ICON.x}投稿</button>`
      :`<div class="txt"><b>まだ参戦予定に入っていません</b>「行く」にすると申請できるようになります</div><button class="btn sm" id="b-go">行く</button>`}</div>
    ${mine&&matchStatus(e.id).t==='done'&&!S.done[e.id]?`<button class="btn sm line" id="b-finish" style="width:100%;margin-top:10px">${ICON.heart}終演した → ありがとうを送って手帳に記録（デモ）</button>`:''}`;
  if(S.done[e.id]){$('#b-diary').onclick=()=>{$('#p-event').classList.remove('open');S.homeView='diary';showTab('home');openDiary(e.id);};}
  else if(mine){$('#b-mytk').onclick=()=>openMyTicket(e.id);$('#b-xpost').onclick=()=>openXPost(e.id);}
  else $('#b-go').onclick=()=>{S.attending[e.id]='none';save();renderEvent();toast('参戦予定に追加しました');};
  const bf=$('#b-finish');if(bf)bf.onclick=()=>openFinish(e.id);
  // 条件バー
  const sum=condSummary(c);
  $('#ev-filters').innerHTML=`<div class="condbar"><div class="condhead"><span class="condtitle">${ICON.sliders}相手の条件 <b>${sum.length}</b>${isCustom?'<em>この公演だけ</em>':''}</span><button class="btn sm" id="b-cond">条件を変える</button></div>
    <div class="condchips">${sum.length?sum.map(t=>`<span>${t}</span>`).join(''):'<span class="none">条件なし（全員表示）</span>'}</div>
    <label class="condtoggle"><input type="checkbox" id="only-match" ${S.onlyMatch?'checked':''}><span>条件をすべて満たす人だけ表示</span></label></div>`;
  $('#b-cond').onclick=()=>openCond(e.id);
  $('#only-match').onchange=ev=>{S.onlyMatch=ev.target.checked;save();renderEvent();};
  let ppl=peopleFor(e.id).map(u=>({u,sc:scoreUser(u,e.id,c)}));
  const full=ppl.filter(x=>x.sc.ng.length===0).length;
  if(S.onlyMatch)ppl=ppl.filter(x=>x.sc.ng.length===0);
  ppl.sort((x,y)=>(y.sc.rate-x.sc.rate)||(y.u.renban-x.u.renban));
  $('#ev-people').innerHTML=`<div class="label">条件に合う人 <b>${full}</b> / 募集中 ${peopleFor(e.id).length}人</div><div class="stack">`+(ppl.length?ppl.map(x=>personHTML(x.u,e.id,x.sc)).join(''):`<div class="empty">条件をすべて満たす人がいません。<br>条件をゆるめるか、「すべて満たす人だけ」を外すと一致率順に表示します。</div>`)+'</div>';
  $('#ev-people').querySelectorAll('.person').forEach(p=>{
    p.onclick=ev=>{if(ev.target.closest('button'))return;openPerson(+p.dataset.uid,e.id);};
    const b=p.querySelector('[data-act]');if(b)b.onclick=()=>act(b.dataset.act,+p.dataset.uid,e.id);
  });
}
function personHTML(u,ev,sc){
  const k=key(ev,u.id);const m=isMatched(ev,u.id);const s=S.sent[k];const inc=S.incoming.find(x=>x.uid===u.id&&x.ev===ev&&x.status==='open');
  const tk=u.tickets[ev];const seat=u.seats?.[ev];
  const tkChip=tk==='two'?`<span class="chip amber">${ICON.ticket}1枚譲れる${seat?' · '+seat:''}</span>`:tk==='one'?`<span class="chip">${ICON.ticket}1枚持ち${seat?' · '+seat:''}</span>`:`<span class="chip">${ICON.ticket}チケット未確保</span>`;
  const sameOshi=u.oshi.filter(o=>S.me.oshi.includes(o)).map(o=>A(o).name+(u.member?'（'+u.member+'推し）':''));
  const pct=Math.round(sc.rate*100);const cls=sc.ng.length===0?'full':pct>=60?'mid':'low';
  const score=sc.total?`<div class="score ${cls}"><b>${sc.ok.length}/${sc.total}</b><span>条件一致</span></div>`:'';
  let cta;
  if(m)cta=`<span class="chip ok">${ICON.check}連番確定</span><button class="btn sm ghost" data-act="chat">トーク</button>`;
  else if(inc)cta=`<span class="chip pink">申請が届いています</span><button class="btn sm" data-act="review">確認する</button>`;
  else if(s&&s.status==='pending')cta=`<span class="chip info">申請中 · 返事待ち</span><button class="btn sm line" data-act="cancel">取り消す</button>`;
  else if(s&&s.status==='declined')cta=`<span class="chip warn">今回は見送り</span><span></span>`;
  else if(!S.attending[ev])cta=`<span class="chip">参戦予定にすると申請できます</span><span></span>`;
  else cta=`<span></span><button class="btn sm" data-act="apply">連番を申請</button>`;
  return `<div class="person ${m?'matched':''}" data-uid="${u.id}">${avatar(u)}
    <div class="main"><div class="h"><b>${u.name}</b><small>@${u.handle}</small>${u.verified?`<span class="vf" title="本人確認済">${ICON.shield}</span>`:''}<small>· ${u.age} · ${genderLabel(u.gender)}</small>${score}</div>
    <div class="trust"><span>参戦 <b>${u.count}</b>回</span><span>連番 <b>${u.renban}</b>回</span><span>ありがとう <b>${u.thanks}</b></span>${u.fc?'<span>FC会員</span>':''}${u.x?`<span class="xlink" title="Xアカウント連携済">${ICON.x}${u.x.f>=1000?(u.x.f/1000).toFixed(1)+'k':u.x.f}</span>`:''}</div>
    <div class="tags">${sameOshi.map(n=>`<span class="hit">推し一致 ${n}</span>`).join('')}${sc.ng.map(n=>`<span class="miss">${n}</span>`).join('')}${u.tags.filter(t=>!sc.ng.includes(t)).map(t=>`<span>${t}</span>`).join('')}</div>
    <div class="bio">${u.bio}</div>
    <div class="cta">${tkChip}<span style="flex:1"></span>${cta}</div></div></div>`;
}

/* ================= 条件設定シート ================= */
function openCond(ev){
  const c=condFor(ev);const isCustom=ev&&!!S.cond.byEvent[ev];const e=ev&&E(ev);
  $('#sh-cond-body').innerHTML=`<div class="grab"></div><h2 style="font-size:18px">相手の条件</h2>
    <p style="font-size:12.5px;color:var(--ink2);margin:4px 0 12px">${e?`${fmtDate(e.date)} ${A(e.a).name} · ${e.venue}`:'すべての公演に使う標準の条件'}。条件を満たさない人も一致率順に表示されるので、細かく決めて大丈夫です。</p>
    ${COND_GROUPS.map(g=>`<div class="label" style="margin:14px 4px 6px">${g}</div>`+CONDS.filter(d=>d.g===g).map(d=>`<div class="condrow"><label>${d.label}</label><div class="opts" data-k="${d.k}">${d.opts.map(o=>`<button type="button" data-v="${o[0]}" class="${c[d.k]===o[0]?'on':''}">${o[1]}</button>`).join('')}</div></div>`).join('')).join('')}
    ${ev?`<label class="condtoggle" style="margin-top:14px"><input type="checkbox" id="cond-scope" ${isCustom?'checked':''}><span>この公演だけに適用する（外すと標準の条件を更新）</span></label>`:''}
    <div class="cta-row" style="margin-top:14px"><button class="btn line" id="cond-reset">初期値に戻す</button><button class="btn" id="cond-save">保存</button></div>`;
  const body=$('#sh-cond-body');
  body.querySelectorAll('.opts').forEach(o=>o.querySelectorAll('button').forEach(b=>b.onclick=()=>{o.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');}));
  $('#cond-reset').onclick=()=>{body.querySelectorAll('.opts').forEach(o=>{o.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.v===DEFAULT_COND[o.dataset.k]));});};
  $('#cond-save').onclick=()=>{
    const v={};body.querySelectorAll('.opts').forEach(o=>{v[o.dataset.k]=o.querySelector('.on').dataset.v;});
    if(ev&&$('#cond-scope').checked)S.cond.byEvent[ev]=v;else{S.cond.default=v;if(ev)delete S.cond.byEvent[ev];}
    save();closeSheets();if($('#p-event').classList.contains('open'))renderEvent();if(tab==='me')renderMe();toast('条件を保存しました。合う人が現れたらお知らせします');
    // デモ：条件を保存したあと、条件に合う人が新しく募集を始める
    const evs=ev?[ev]:Object.keys(S.attending);
    evs.forEach(x=>{const lu=USERS.find(u=>u.late&&u.tickets[x]&&!S.unlocked[x]);if(!lu)return;
      setTimeout(()=>{S.unlocked[x]=true;save();const sc=scoreUser(lu,x,condFor(x));const msg=`${lu.name}さんが ${A(E(x).a).name} ${E(x).venue} の連番募集を始めました（条件一致 ${sc.ok.length}/${sc.total}）`;notify(msg,x);toast(msg);
        if($('#p-event').classList.contains('open')&&curEv===x)renderEvent();if(tab==='home')renderHome();},8000);});
  };
  openSheet('sh-cond');
}

/* ================= 自分のチケット（募集内容） ================= */
function openMyTicket(ev){
  const e=E(ev),st=S.attending[ev],mt=S.myTicket[ev]||{};
  const seats=e.type==='指定席'?['アリーナ','スタンド','1階','2階','S席','A席','注釈付き']:['整理番号A','整理番号B','整理番号C','整理番号 未定'];
  $('#sh-mytk-body').innerHTML=`<div class="grab"></div><h2 style="font-size:18px">自分の募集内容</h2><p style="font-size:12.5px;color:var(--ink2);margin:4px 0 12px">${fmtDate(e.date)} ${A(e.a).name} · ${e.venue}。相手の一覧にこの内容が表示されます。</p>
    <div class="condrow"><label>チケット</label><div class="opts" id="mt-st">${Object.entries(TICKET).map(([k,v])=>`<button type="button" data-v="${k}" class="${st===k?'on':''}">${v.split('（')[0]}</button>`).join('')}</div></div>
    <div class="condrow"><label>席種・整理番号</label><div class="opts" id="mt-seat">${seats.map(s=>`<button type="button" data-v="${s}" class="${mt.seat===s?'on':''}">${s}</button>`).join('')}</div></div>
    <div class="field" style="margin-top:8px"><label>席の補足（ブロック・番号など）</label><input id="mt-seatnote" value="${esc(mt.seatNote||'')}" placeholder="例：Aブロック 12列"></div>
    <div class="condrow"><label>受け渡し方法</label><div class="opts" id="mt-method">${Object.entries(METHOD).map(([k,v])=>`<button type="button" data-v="${k}" class="${mt.method===k?'on':''}">${v}</button>`).join('')}</div></div>
    <div class="note" style="padding:8px 0">チケットのやり取りは定価のみ。金銭の受け渡しはアプリ内では扱いません。</div>
    <div class="cta-row"><button class="btn line" id="mt-remove">参戦予定から外す</button><button class="btn" id="mt-save">保存</button></div>`;
  const body=$('#sh-mytk-body');
  body.querySelectorAll('.opts').forEach(o=>o.querySelectorAll('button').forEach(b=>b.onclick=()=>{o.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');}));
  $('#mt-save').onclick=()=>{
    S.attending[ev]=body.querySelector('#mt-st .on').dataset.v;
    const seat=body.querySelector('#mt-seat .on')?.dataset.v||'';const note=$('#mt-seatnote').value.trim();
    S.myTicket[ev]={seat:seat+(note?' '+note:''),method:body.querySelector('#mt-method .on')?.dataset.v||''};
    save();closeSheets();renderEvent();toast('募集内容を保存しました');
  };
  $('#mt-remove').onclick=()=>{delete S.attending[ev];delete S.myTicket[ev];save();closeSheets();renderEvent();toast('参戦予定から外しました');};
  openSheet('sh-mytk');
}
function act(kind,uid,ev){
  if(kind==='apply')openApply(uid,ev);
  if(kind==='cancel'){delete S.sent[key(ev,uid)];save();renderEvent();toast('申請を取り消しました');}
  if(kind==='chat')openChat(key(ev,uid));
  if(kind==='review'){$('#p-event').classList.remove('open');showTab('req');}
}

  const cta=$('#sh-person-cta');
  if(ev&&isMatched(ev,uid)){cta.innerHTML=`<button class="btn" id="shp-chat">トークを開く</button>`;$('#shp-chat').onclick=()=>{closeSheets();openChat(key(ev,uid));};}
  else if(ev&&S.attending[ev]&&!S.sent[key(ev,uid)]&&!S.incoming.find(x=>x.uid===uid&&x.ev===ev&&x.status==='open')){cta.innerHTML=`<button class="btn line" id="shp-close">閉じる</button><button class="btn" id="shp-apply">連番を申請</button>`;$('#shp-apply').onclick=()=>{closeSheets();openApply(uid,ev);};$('#shp-close').onclick=closeSheets;}
  else{cta.innerHTML=`<button class="btn ghost" id="shp-close">閉じる</button>`;$('#shp-close').onclick=closeSheets;}
  openSheet('sh-person');
}
function closeSheets(){$$('.sheet').forEach(s=>s.classList.remove('open'));}
function openSheet(id){const p=$('#'+id+' .panel');if(!p.querySelector('.sheetx')){const b=document.createElement('button');b.className='sheetx';b.title='閉じる';b.innerHTML=ICON.close;b.onclick=closeSheets;p.appendChild(b);}$('#'+id).classList.add('open');}
$$('.sheet').forEach(s=>s.addEventListener('click',e=>{if(e.target===s)closeSheets();}));
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if($$('.sheet.open').length)closeSheets();else if($('#match').classList.contains('open'))$('#match').classList.remove('open');});

/* ================= 確認・入力ダイアログ（prompt / confirm はサンドボックス内で動かないため） ================= */
function askDialog({title,desc='',input=false,value='',ok='OK',danger=false}){return new Promise(res=>{
  $('#sh-dialog-body').innerHTML=`<div class="grab"></div><h2 style="font-size:18px">${esc(title)}</h2>${desc?`<p style="font-size:12.5px;color:var(--ink2);margin:4px 0 12px">${esc(desc)}</p>`:''}

    <div class="cta-row" style="margin-top:10px"><button class="btn line" id="dlg-cancel">やめる</button><button class="btn ${danger?'danger solid':''}" id="dlg-ok">${esc(ok)}</button></div>`;
  $('#dlg-ok').onclick=()=>{const v=input?$('#dlg-input').value.trim():true;closeSheets();res(v||null);};
  $('#dlg-cancel').onclick=()=>{closeSheets();res(null);};
  openSheet('sh-dialog');if(input){const i=$('#dlg-input');i.focus();i.select();i.onkeydown=e=>{if(e.key==='Enter'||e.keyCode===13){e.preventDefault();$('#dlg-ok').click();}};}
});}

/* ================= お知らせ ================= */

/* ================= 通報・ブロック ================= */
const REPORT_REASONS=['転売・高額譲渡の勧誘','なりすまし・虚偽のプロフィール','不快なメッセージ・迷惑行為','ドタキャン・無断キャンセル','その他'];

    <div class="field" style="margin-top:10px"><label>詳細（任意）</label><textarea id="rp-text" maxlength="300" placeholder="いつ・どこで・何があったか"></textarea></div>
    <label class="check"><input type="checkbox" id="rp-block" checked><span>この人をブロックする（お互いに表示されなくなります）</span></label>

  $('#rp-cancel').onclick=closeSheets;
  $('#rp-send').onclick=()=>{const reason=REPORT_REASONS[+body.querySelector('#rp-reason .on').dataset.v];const block=$('#rp-block').checked;
    S.reports.push({uid,ev:ev||null,reason,text:$('#rp-text').value.trim(),at:Date.now()});
    if(block){S.blocked[uid]=true;S.incoming.forEach(x=>{if(x.uid===uid&&x.status==='open')x.status='declined';});Object.keys(S.sent).forEach(k=>{if(k.split('_')[1]===String(uid))delete S.sent[k];});}
    save();closeSheets();if($('#p-event').classList.contains('open'))renderEvent();if(tab==='req')renderReq();if(tab==='home')renderHome();updateBadges();
    toast(block?'通報を受け付け、ブロックしました（デモ）':'通報を受け付けました（デモ）');};
  openSheet('sh-report');}

/* ================= 終演後：ありがとう → 手帳 ================= */
function openFinish(ev){const m=S.matches.find(x=>x.ev===ev);if(!m)return;const u=U(m.uid),e=E(ev),mt=S.myTicket[ev]||{};
  $('#sh-finish-body').innerHTML=`<div class="grab"></div><div class="ph">${avatar(u)}<div><h2>お疲れさまでした</h2><p>${fmtDate(e.date)} ${A(e.a).name} · ${e.venue}</p></div></div>
    <div class="note" style="padding:12px 0 6px">${u.name}さんに「ありがとう」を送ります。ありがとうの数は相手の信頼スコアになり、この公演はあなたの手帳（参戦履歴）に残ります。</div>
    <div class="field"><label>連番はどうでしたか</label><div class="starpick" id="f-stars">${[1,2,3,4,5].map(i=>`<button type="button" data-v="${i}" class="on"><svg viewBox="0 0 24 24"><path d="M12 3l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.4 6.3 20.5l1.2-6.4L2.8 9.7l6.4-.8z"/></svg></button>`).join('')}</div></div>
    <div class="field"><label>ひとこと（任意・相手に届きます）</label><input id="f-word" maxlength="60" placeholder="例：物販の案内が助かりました"></div>
    <div class="cta-row"><button class="btn line" id="f-cancel">あとで</button><button class="btn" id="f-send">${ICON.heart}ありがとうを送る</button></div>`;
  const sp=$('#f-stars');sp.dataset.v=5;sp.querySelectorAll('button').forEach(b=>b.onclick=()=>{const v=+b.dataset.v;sp.querySelectorAll('button').forEach(x=>x.classList.toggle('on',+x.dataset.v<=v));sp.dataset.v=v;});
  $('#f-cancel').onclick=closeSheets;
  $('#f-send').onclick=()=>{const rating=+sp.dataset.v||5;
    S.done[ev]={uid:u.id,rating,word:$('#f-word').value.trim(),at:Date.now()};
    S.diary[ev]={seat:mt.seat||'',with:u.name,rating,cost:{ticket:0,travel:0,stay:0,goods:0},memo:''};
    delete S.attending[ev];delete S.myTicket[ev];delete S.cond.byEvent[ev];save();closeSheets();

    setTimeout(()=>openDiary(ev),700);
    // デモ：相手からもありがとうが返ってくる
    setTimeout(()=>{S.me.thanks++;pushThem(m.key,'今日はありがとうございました！また連番しましょう');notify(`${u.name}さんから「ありがとう」が届きました（ありがとう ${S.me.thanks}）`,null);toast(`${u.name}さんからありがとうが届きました`);if(tab==='me')renderMe();},6000);};
  openSheet('sh-finish');}

/* ================= はじめての案内 ================= */
const INTRO=[
 {icon:'ticket',title:'公演を選ぶところから',text:'スワイプで人を選ぶアプリではありません。まず「さがす」で行く公演を見つけて「行く」にすると、その公演に行く人だけが並びます。'},
 {icon:'sliders',title:'18項目の条件で絞って申請',text:'性別・本人確認・物販・声出しなどの条件で相手を絞り、申請を送ります。条件に合わない人も一致率順に見えるので、取りこぼしません。'},
 {icon:'users',title:'当日メモで段取り、終演後はありがとう',text:'成立したらトークと当日メモで集合場所を決めます。終演後は「ありがとう」を送り合い、手帳に参戦の記録が残ります。'}
];
let introI=0;
function renderIntro(){const s=INTRO[introI],last=introI===INTRO.length-1;
  $('#intro-card').innerHTML=`<div class="big">${ICON[s.icon]}</div><div class="eyebrow">Step ${introI+1} / ${INTRO.length}</div><h2>${s.title}</h2><p>${s.text}</p><div class="dots">${INTRO.map((_,i)=>`<i class="${i===introI?'on':''}"></i>`).join('')}</div><button class="btn" id="intro-next">${last?'はじめる':'次へ'}</button>${last?'':'<button class="skip" id="intro-skip">スキップ</button>'}`;
  $('#intro-next').onclick=()=>{if(introI<INTRO.length-1){introI++;renderIntro();}else closeIntro();};const sk=$('#intro-skip');if(sk)sk.onclick=closeIntro;}
function openIntro(){introI=0;renderIntro();const l=$('#intro-lights');l.innerHTML='';for(let i=0;i<22;i++){const p=document.createElement('i');p.style.left=(i/22*100+2)+'%';p.style.color=`hsl(${[200,45,330,275][i%4]} 90% 65%)`;p.style.animationDelay=(i*.13)+'s';l.appendChild(p);}$('#intro').classList.add('open');}
function closeIntro(){$('#intro').classList.remove('open');S.onboarded=true;save();}

/* ================= 申請 ================= */
const APPLY_TPL=['はじめまして。この公演、連番お願いできませんか？','推しが同じなので、一緒に楽しめたら嬉しいです。','物販も一緒に並べる方を探しています。','連番は初めてですが、よろしくお願いします。'];
function openApply(uid,ev){
  const u=U(uid),e=E(ev);
  $('#sh-apply-body').innerHTML=`<div class="grab"></div><div class="ph">${avatar(u)}<div><h2>${u.name}さんに連番を申請</h2><p>${fmtDate(e.date)} ${A(e.a).name} · ${e.venue}</p></div></div>
    <div class="note" style="padding:12px 0">あなたのプロフィール（推し・参戦回数・スタイル）と一緒に送られます。相手が承諾すると連番成立です。</div>
    <div class="field"><label>メッセージ</label><textarea id="ap-msg">${APPLY_TPL[0]}</textarea></div>
    <div class="tagpick" id="ap-tpl">${APPLY_TPL.map(t=>`<button type="button">${t}</button>`).join('')}</div>
    <div class="cta-row" style="margin-top:16px"><button class="btn line" id="ap-cancel">やめる</button><button class="btn" id="ap-send">申請を送る</button></div>`;
  $('#ap-tpl').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('#ap-msg').value=b.textContent;});
  $('#ap-cancel').onclick=closeSheets;
  $('#ap-send').onclick=()=>{
    const msg=$('#ap-msg').value.trim()||APPLY_TPL[0];
    S.sent[key(ev,uid)]={status:'pending',at:Date.now(),msg};save();closeSheets();
    if($('#p-event').classList.contains('open'))renderEvent();if(tab==='req')renderReq();
    toast(u.name+'さんに申請を送りました');
    // 相手の返事（デモ：数秒後）
    setTimeout(()=>respond(uid,ev),3500+Math.random()*3000);
  };
}
function respond(uid,ev){
  const k=key(ev,uid),s=S.sent[k];if(!s||s.status!=='pending')return;
  const u=U(uid);
  if(u.friendly){s.status='accepted';save();createMatch(uid,ev,'sent');}
  else{s.status='declined';save();notify(`${u.name}さんは ${E(ev).venue} の連番を今回は見送りました`,ev);toast(u.name+'さんは今回見送りとのことです');if($('#p-event').classList.contains('open'))renderEvent();if(tab==='req')renderReq();}
}
function renderReq(){
  const inc=S.incoming.filter(x=>x.status==='open').sort((a,b)=>b.at-a.at);
  const sent=Object.entries(S.sent).sort((a,b)=>b[1].at-a[1].at);
  let html=`<div class="label">届いた申請 <b>${inc.length}</b></div><div class="stack">`;
  html+=inc.length?inc.map(r=>{const u=U(r.uid),e=E(r.ev);return `<div class="req" data-uid="${u.id}" data-ev="${e.id}"><div class="who">${avatar(u)}<div class="t"><b>${u.name} <small style="color:var(--ink2);font-weight:400">@${u.handle} · ${u.age} · ${genderLabel(u.gender)}</small></b><span>${fmtDate(e.date)} ${A(e.a).name} · ${e.venue}</span></div><time style="font-size:11px;color:var(--ink3)">${fmtTime(r.at)}</time></div>
      <div class="trust" style="display:flex;gap:10px;font-size:12px;color:var(--ink2)"><span>参戦 <b>${u.count}</b>回</span><span>連番 <b>${u.renban}</b>回</span><span>ありがとう <b>${u.thanks}</b></span>${u.verified?`<span style="color:var(--info)">本人確認済</span>`:''}</div>
      <div class="msg">${esc(r.msg)}</div>
      <div class="acts"><button class="btn line" data-a="decline">見送る</button><button class="btn" data-a="accept">承諾して連番にする</button></div></div>`;}).join(''):`<div class="empty">新しい申請はありません</div>`;
  html+=`</div><div class="label" style="margin-top:22px">送った申請 <b>${sent.length}</b></div><div class="stack">`;
  html+=sent.length?sent.map(([k,s])=>{const [ev,uid]=k.split('_');const u=U(+uid),e=E(ev);
    const st=s.status==='accepted'?`<span class="chip ok">${ICON.check}承諾 · 連番確定</span>`:s.status==='declined'?`<span class="chip warn">見送り</span>`:`<span class="chip info">返事待ち</span>`;
    return `<div class="req ${s.status==='pending'?'pending':''}" data-uid="${u.id}" data-ev="${e.id}"><div class="who">${avatar(u)}<div class="t"><b>${u.name}</b><span>${fmtDate(e.date)} ${A(e.a).name} · ${e.venue}</span></div>${st}</div>
      ${s.status==='accepted'?`<div class="acts"><button class="btn ghost" data-a="chat">トークを開く</button></div>`:s.status==='pending'?`<div class="acts"><button class="btn line" data-a="cancel">取り消す</button></div>`:''}</div>`;}).join(''):`<div class="empty">まだ申請を送っていません</div>`;
  html+='</div>';
  $('#req').innerHTML=html;
  $('#req').querySelectorAll('.req').forEach(r=>{
    const uid=+r.dataset.uid,ev=r.dataset.ev;
    r.querySelector('.who').onclick=()=>openPerson(uid,ev);
    r.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
      const a=b.dataset.a;
      if(a==='accept'){const it=S.incoming.find(x=>x.uid===uid&&x.ev===ev);it.status='accepted';save();createMatch(uid,ev,'incoming');}
      if(a==='decline'){const it=S.incoming.find(x=>x.uid===uid&&x.ev===ev);it.status='declined';save();renderReq();updateBadges();toast('見送りました');}
      if(a==='cancel'){delete S.sent[key(ev,uid)];save();renderReq();toast('取り消しました');}
      if(a==='chat')openChat(key(ev,uid));
    });
  });
}

/* ================= 連番成立 ================= */
let matchKey=null;
function createMatch(uid,ev,how){
  const k=key(ev,uid);if(S.matches.some(m=>m.key===k))return;
  const u=U(uid),e=E(ev);
  S.matches.push({key:k,uid,ev,at:Date.now()});S.chats[k]=S.chats[k]||[];
  if(S.attending[ev]==='none'&&u.tickets[ev]==='two')S.attending[ev]='one'; // 相手から1枚もらえる想定
  save();matchKey=k;notify(`${u.name}さんと ${fmtDate(e.date)} ${A(e.a).name} の連番が成立しました`,ev);
  $('#m-me').outerHTML=avatar(S.me).replace('class="avatar','id="m-me" class="avatar');
  $('#m-them').outerHTML=avatar(u).replace('class="avatar','id="m-them" class="avatar');
  $('#m-sub').innerHTML=`<b>${fmtDate(e.date)} ${A(e.a).name}</b><br>${e.venue}<br>${u.name}さんと連番が決まりました`;
  const l=$('#lights');l.innerHTML='';for(let i=0;i<22;i++){const p=document.createElement('i');p.style.left=(i/22*100+2)+'%';p.style.color=`hsl(${[A(e.a).hue,45,330,200][i%4]} 90% 65%)`;p.style.animationDelay=(i*.13)+'s';l.appendChild(p);}
  $('#match').classList.add('open');
  const opener=how==='incoming'?`承諾ありがとうございます！${e.venue}、よろしくお願いします。当日の待ち合わせはどうしますか？`:u.opener;
  setTimeout(()=>pushThem(k,opener),4500+Math.random()*2500);
  if($('#p-event').classList.contains('open'))renderEvent();if(tab==='req')renderReq();if(tab==='home')renderHome();updateBadges();
}
$('#b-match-close').onclick=()=>$('#match').classList.remove('open');
$('#b-match-chat').onclick=()=>{$('#match').classList.remove('open');openChat(matchKey);};

/* ================= トーク ================= */
function renderTalk(){
  const t=$('#talk');
  if(!S.matches.length){t.innerHTML=`<div class="empty">${ICON.users}まだ連番が成立していません。<br>「現場」から公演を選んで申請するか、<br>「申請」タブで届いた申請を承諾しましょう。</div>`;return;}
  const sorted=[...S.matches].sort((a,b)=>{const la=S.chats[a.key]?.slice(-1)[0]?.at||a.at,lb=S.chats[b.key]?.slice(-1)[0]?.at||b.at;return lb-la;});
  t.innerHTML=`<div class="label">連番相手 <b>${sorted.length}</b></div>`+sorted.map(m=>{
    const u=U(m.uid),e=E(m.ev),c=S.chats[m.key]||[],last=c.slice(-1)[0];const unread=!S.read[m.key]&&c.some(x=>x.from==='them');
    const preview=last?(last.from==='me'?'あなた: ':'')+last.text:'連番成立。当日の相談をしましょう';
    return `<div class="row" data-k="${m.key}">${avatar(u)}<div class="txt"><em>${fmtDate(e.date)} ${A(e.a).name} · ${e.venue}${S.done[m.ev]?' · 終演':''}</em><b>${u.name}</b><span class="${unread?'unread':''}">${esc(preview)}</span></div><div style="text-align:right"><time>${fmtTime(last?last.at:m.at)}</time>${unread?`<div class="n">${c.filter(x=>x.from==='them').length}</div>`:''}</div></div>`;
  }).join('');
  t.querySelectorAll('.row').forEach(r=>r.onclick=()=>openChat(r.dataset.k));
}
let chatKey=null,typingTimer=null;
const QUICK=['当日の待ち合わせ、どこにしますか？','物販は並びますか？','開場30分前に集合でどうでしょう','チケットの受け渡しは当日でお願いします','終演後、少し感想会しませんか？'];
function openChat(k){
  chatKey=k;const m=S.matches.find(x=>x.key===k);if(!m)return;const u=U(m.uid),e=E(m.ev);
  $('#chat-avatar').outerHTML=avatar(u,'sm').replace('class="avatar','id="chat-avatar" class="avatar');
  $('#chat-name').textContent=u.name;$('#chat-ev').textContent=`${fmtDate(e.date)} ${A(e.a).name} · ${e.venue}`;
  $('#quick').innerHTML=QUICK.map(q=>`<button type="button">${q}</button>`).join('');
  $('#quick').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('#msg-input').value=b.textContent;$('#msg-input').focus();});
  S.read[k]=true;save();renderNoteBar();renderChat();$('#p-chat').classList.add('open');updateBadges();
}
$('#b-chat-back').onclick=()=>{$('#p-chat').classList.remove('open');chatKey=null;if(tab==='talk')renderTalk();updateBadges();};
$('#b-chat-profile').onclick=()=>{const m=S.matches.find(x=>x.key===chatKey);openPerson(m.uid,m.ev);};
function renderChat(){
  const box=$('#msgs');const m=S.matches.find(x=>x.key===chatKey);const u=U(m.uid),c=S.chats[chatKey]||[];
  box.innerHTML=`<div class="sys">${fmtTime(m.at)} に ${u.name}さんと連番が成立しました<br>連絡先の交換は成立後に。チケットの売買はアプリ外で行わないでください</div>`+c.map(x=>`<div class="bubble ${x.from}">${esc(x.text)}<time>${fmtTime(x.at)}</time></div>`).join('');
  box.scrollTop=box.scrollHeight;
}
$('#composer').addEventListener('submit',e=>{
  e.preventDefault();const inp=$('#msg-input');const t=inp.value.trim();if(!t||!chatKey)return;
  (S.chats[chatKey]=S.chats[chatKey]||[]).push({from:'me',text:t,at:Date.now()});inp.value='';save();renderChat();scheduleReply(chatKey);
});
function scheduleReply(k){
  const m=S.matches.find(x=>x.key===k);const u=U(m.uid);const mine=(S.chats[k]||[]).filter(x=>x.from==='me').length;
  clearTimeout(typingTimer);
  typingTimer=setTimeout(()=>{
    if(chatKey===k){const t=document.createElement('div');t.className='typing';t.id='typing';t.innerHTML='<i></i><i></i><i></i>';$('#msgs').appendChild(t);$('#msgs').scrollTop=$('#msgs').scrollHeight;}
    setTimeout(()=>{$('#typing')?.remove();pushThem(k,u.replies[(mine-1)%u.replies.length]);},1200+Math.random()*1500);
  },700+Math.random()*800);
}
function pushThem(k,text){
  if(!S.matches.some(x=>x.key===k))return;
  (S.chats[k]=S.chats[k]||[]).push({from:'them',text,at:Date.now()});
  if(chatKey===k){S.read[k]=true;renderChat();}else S.read[k]=false;
  save();updateBadges();if(tab==='talk'&&chatKey!==k)renderTalk();
}

/* ================= 当日メモ ================= */
const CHECKS=['集合場所と時間を決めた','チケットの受け渡し方法を決めた','連絡手段（当日つながる方法）を交換した','物販に並ぶかどうか決めた','終演後の予定を決めた'];
function renderNoteBar(){
  const n=S.notes[chatKey]||{};const done=(n.done||[]).length;
  $('#note-sum').textContent=n.place||n.time?`${n.time||''} ${n.place||''}`.trim()+` · ${done}/${CHECKS.length} 済`:`集合場所・時間を決めましょう · ${done}/${CHECKS.length} 済`;
}
$('#notebar').onclick=()=>{
  const m=S.matches.find(x=>x.key===chatKey);const e=E(m.ev),u=U(m.uid);const n=S.notes[chatKey]||{done:[]};
  $('#sh-note-body').innerHTML=`<div class="grab"></div><h2 style="font-size:18px">当日メモ</h2><p style="font-size:12.5px;color:var(--ink2);margin:4px 0 14px">${fmtDate(e.date)} ${A(e.a).name} · ${e.venue}（開場 ${e.open} / 開演 ${e.start}）· ${u.name}さんと</p>
    <div class="field-row"><div class="field"><label>集合時間</label><input id="n-time" value="${esc(n.time||'')}" placeholder="例：${e.open}の30分前"></div><div class="field"><label>集合場所</label><input id="n-place" value="${esc(n.place||'')}" placeholder="例：新横浜駅 北口改札"></div></div>
    <div class="field"><label>チケットの受け渡し</label><select id="n-ticket"><option value="">未定</option><option ${n.ticket==='me'?'selected':''} value="me">自分が2枚持っていて渡す</option><option ${n.ticket==='them'?'selected':''} value="them">相手から1枚受け取る</option><option ${n.ticket==='each'?'selected':''} value="each">それぞれ1枚ずつ持っている</option></select></div>
    <div class="label" style="margin:6px 4px 8px">チェックリスト</div>
    ${CHECKS.map((c,i)=>`<label class="check ${n.done?.includes(i)?'on':''}"><input type="checkbox" data-i="${i}" ${n.done?.includes(i)?'checked':''}><span>${c}</span></label>`).join('')}
    <div class="cta-row" style="margin-top:14px"><button class="btn line" id="n-close">閉じる</button><button class="btn" id="n-save">保存</button></div>`;
  $('#sh-note-body').querySelectorAll('input[type=checkbox]').forEach(cb=>cb.onchange=()=>cb.closest('.check').classList.toggle('on',cb.checked));
  $('#n-close').onclick=closeSheets;
  $('#n-save').onclick=()=>{S.notes[chatKey]={time:$('#n-time').value.trim(),place:$('#n-place').value.trim(),ticket:$('#n-ticket').value,done:[...$('#sh-note-body').querySelectorAll('input[type=checkbox]:checked')].map(c=>+c.dataset.i)};save();closeSheets();renderNoteBar();toast('当日メモを保存しました');};
  openSheet('sh-note');
};

/* ================= マイページ ================= */
function renderMe(){
  const m=S.me;const sg=condFor(null).gender==='same';
  $('#me').innerHTML=`<div class="me-card">${avatar(m,'lg')}<div><h2>${esc(m.name)}</h2><p>@${esc(m.handle)} · ${m.age} · ${genderLabel(m.gender)} · ${m.area}</p></div></div>
    <div class="stats"><div class="stat"><b>${pastList().length}</b><span>参戦回数</span></div><div class="stat"><b>${m.renban+S.matches.length}</b><span>連番回数</span></div><div class="stat"><b>${m.thanks}</b><span>ありがとう</span></div></div>
    <div class="label" style="margin-top:20px">X（Twitter）連携</div>
    <div class="xcard ${m.x?'':'off'}">${ICON.x}<div><b>${m.x?'@'+esc(m.x)+' を連携済':'未連携'}</b><span>${m.x?'募集の投稿とアカウント履歴の表示に使います':'連携すると募集をXにも出せて、アカウント履歴が信頼の材料になります'}</span></div></div>
    <div class="field-row" style="margin-bottom:6px"><div class="field"><label>Xのユーザー名</label><input id="f-x" value="${esc(m.x||'')}" placeholder="@なしで入力"></div><div class="field"><label>&nbsp;</label><button class="btn ghost" id="b-ximport" style="width:100%">${ICON.x}募集文から取り込む</button></div></div>
    <div class="note" style="padding:0 4px 8px">本番では「Xでログイン」で連携します。デモでは入力したユーザー名を表示に使うだけで、通信はしません。</div>
    <div class="label" style="margin-top:20px">相手の標準条件</div>
    <div class="condbar" style="margin:0"><div class="condchips">${condSummary(condFor(null)).map(t=>`<span>${t}</span>`).join('')||'<span class="none">条件なし</span>'}</div><button class="btn sm ghost" id="b-cond-def" style="align-self:flex-start">標準の条件を変える</button></div>
    <div class="note" style="padding:8px 4px 0">公演ごとに条件を変えることもできます（公演ページの「条件を変える」）。</div>
    <div class="label" style="margin-top:20px">安心設定</div>
    <div class="toggle ${sg?'on':''}" id="t-sg"><div class="t"><b>同性のみ表示</b><span>${m.gender==='N'?'性別を「回答しない」にしている間は絞り込みません':'標準の条件「性別」を同性のみにします'}</span></div><span class="sw"></span></div>
    <div class="label" style="margin-top:20px">プロフィール</div>
    <div class="field-row"><div class="field"><label>表示名</label><input id="f-name" value="${esc(m.name)}" maxlength="10"></div><div class="field"><label>ハンドル</label><input id="f-handle" value="${esc(m.handle)}" maxlength="16"></div></div>
    <div class="field-row"><div class="field"><label>年代</label><select id="f-age">${['10代後半','20代前半','20代後半','30代前半','30代後半','40代','50代以上'].map(a=>`<option ${m.age===a?'selected':''}>${a}</option>`).join('')}</select></div>
    <div class="field"><label>性別</label><select id="f-gender"><option value="F" ${m.gender==='F'?'selected':''}>女性</option><option value="M" ${m.gender==='M'?'selected':''}>男性</option><option value="N" ${m.gender==='N'?'selected':''}>回答しない</option></select></div></div>
    <div class="field"><label>推し（複数可）</label><div class="tagpick" id="f-oshi">${ARTISTS.map(a=>`<button type="button" data-id="${a.id}" class="${m.oshi.includes(a.id)?'on':''}">${a.name}</button>`).join('')}</div></div>
    <div class="field"><label>現場スタイル（最大4つ）</label><div class="tagpick" id="f-tags">${STYLE_TAGS.map(t=>`<button type="button" class="${m.tags.includes(t)?'on':''}">${t}</button>`).join('')}</div></div>
    <div class="field"><label>自己紹介</label><textarea id="f-bio" maxlength="200">${esc(m.bio)}</textarea></div>
    <button class="btn" id="b-save" style="width:100%">保存する</button>
    <div class="label" style="margin-top:22px">このデモについて</div>
    <div class="note">ライブの「連番相手」を探すためのアプリのデモ版です。アーティスト・公演・ユーザーはすべて架空です。データはこの端末の中だけに保存され、外部には送信されません。</div>
    <div class="cta-row"><button class="btn ghost" id="b-intro">使い方をもう一度見る</button><button class="btn danger" id="b-reset">デモをリセットする</button></div>`;
  $('#t-sg').onclick=()=>{S.cond.default=Object.assign({},S.cond.default,{gender:sg?'any':'same'});save();renderMe();toast(sg?'同性のみ表示を解除しました':'同性のみ表示にしました');};
  $('#b-intro').onclick=openIntro;
  $('#b-cond-def').onclick=()=>openCond(null);
  $('#b-ximport').onclick=openXImport;
  $('#f-oshi').querySelectorAll('button').forEach(b=>b.onclick=()=>b.classList.toggle('on'));
  $('#f-tags').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(!b.classList.contains('on')&&$('#f-tags').querySelectorAll('.on').length>=4){toast('選べるのは4つまでです');return;}b.classList.toggle('on');});
  $('#b-save').onclick=()=>{m.name=$('#f-name').value.trim()||m.name;m.handle=$('#f-handle').value.trim()||m.handle;m.age=$('#f-age').value;m.gender=$('#f-gender').value;
    m.x=$('#f-x').value.trim().replace(/^@/,'');m.oshi=[...$('#f-oshi').querySelectorAll('.on')].map(b=>b.dataset.id);m.tags=[...$('#f-tags').querySelectorAll('.on')].map(b=>b.textContent);m.bio=$('#f-bio').value.trim();save();renderMe();toast('保存しました');};
  $('#b-reset').onclick=async()=>{if(await askDialog({title:'デモをリセット',desc:'申請・連番・トーク・手帳の記録をすべて消して、最初の状態に戻します。',ok:'リセットする',danger:true})){S=defaultState();S.onboarded=true;save();showTab('home');toast('リセットしました');}};
}
$('#b-theme').onclick=()=>{
  const r=document.documentElement;const cur=r.getAttribute('data-theme');const sysLight=matchMedia('(prefers-color-scheme: light)').matches;
  const isLight=cur==='light'||(!cur&&sysLight);r.setAttribute('data-theme',isLight?'dark':'light');
  try{localStorage.setItem(KEY+'_theme',isLight?'dark':'light');}catch(e){}
};
try{const t=localStorage.getItem(KEY+'_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
let toastT;function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),1800);}

/* ================= 起動 ================= */
renderHome();updateBadges();
if(!S.onboarded)openIntro();
// X投稿のリンク（#ev=e1）から来たときは、その公演ページを直接開く
try{const mm=(location.hash+location.search).match(/ev=(e\d+)/);if(mm&&E(mm[1]))openEvent(mm[1]);}catch(e){}
// PWA（GitHub Pages などで配信したときだけ。Artifact 内では登録しない）
try{if('serviceWorker' in navigator&&/github\.io|localhost|127\.0\.0\.1/.test(location.hostname))navigator.serviceWorker.register('sw.js');}catch(e){}
</script>
