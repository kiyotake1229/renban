<title>Tomoni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F7F5FB; --bg2:#FFFFFF; --bg3:#EEEAF6;
  --ink:#1F1B2E; --ink2:#5C5772; --ink3:#9A95AD;
  --line:#E3DFEE;
  --accent:#F07A5A; --accent-ink:#FFFFFF; --accent-soft:#FDE9E2;
  --indigo:#3A3F7A;
  --like:#2FB57F; --nope:#E4506B; --star:#4C8DF5;
  --shadow:0 18px 40px rgba(31,27,46,.14);
  --shadow-sm:0 4px 14px rgba(31,27,46,.08);
  --r:22px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15131D; --bg2:#1E1B29; --bg3:#272334;
    --ink:#EDE9F5; --ink2:#B4AEC8; --ink3:#7A748F;
    --line:#2F2B3D;
    --accent:#F58A6C; --accent-ink:#1A1520; --accent-soft:#3A2A2A;
    --shadow:0 18px 40px rgba(0,0,0,.45);
    --shadow-sm:0 4px 14px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#15131D; --bg2:#1E1B29; --bg3:#272334;
  --ink:#EDE9F5; --ink2:#B4AEC8; --ink3:#7A748F;
  --line:#2F2B3D;
  --accent:#F58A6C; --accent-ink:#1A1520; --accent-soft:#3A2A2A;
  --shadow:0 18px 40px rgba(0,0,0,.45);
  --shadow-sm:0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.num{font-family:"Outfit",system-ui,sans-serif;font-variant-numeric:tabular-nums}
svg{display:block}

/* ---------- shell ---------- */
#app{
  height:100dvh; max-width:430px; margin:0 auto;
  display:flex; flex-direction:column;
  background:var(--bg); position:relative; overflow:hidden;
}
@media(min-width:700px){
  body{background:var(--bg3)}
  #app{height:min(880px,calc(100dvh - 32px));margin-top:16px;border-radius:36px;box-shadow:var(--shadow);border:1px solid var(--line)}
}
.screen{flex:1;display:none;flex-direction:column;min-height:0}
.screen.active{display:flex}
.top{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 20px 10px;
}
.brand{font-family:"Outfit",sans-serif;font-weight:700;font-size:22px;letter-spacing:-.01em;color:var(--accent);display:flex;align-items:center;gap:8px}
.top h1{font-size:19px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);background:var(--bg3);padding:6px 10px;border-radius:999px}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);transition:background .2s,transform .2s}
.iconbtn:hover{background:var(--bg3)}
.iconbtn:active{transform:scale(.92)}
.iconbtn:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- tab bar ---------- */
nav.tabs{
  display:flex;justify-content:space-around;align-items:center;
  padding:8px 8px calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:var(--bg2);
}
nav.tabs button{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;color:var(--ink3);padding:6px 14px;border-radius:14px;
  position:relative;transition:color .2s,transform .2s;
}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
nav.tabs button.on{color:var(--accent)}
nav.tabs button.on svg{transform:translateY(-2px) scale(1.08)}
nav.tabs button .badge{
  position:absolute;top:2px;right:8px;min-width:18px;height:18px;padding:0 5px;
  border-radius:9px;background:var(--accent);color:var(--accent-ink);
  font-size:11px;font-weight:600;display:grid;place-items:center;
  animation:pop .35s cubic-bezier(.34,1.56,.64,1);
}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}

/* ---------- discover ---------- */
.deck{flex:1;position:relative;margin:4px 16px 8px;min-height:0}
.card{
  position:absolute;inset:0;border-radius:28px;overflow:hidden;
  background:var(--bg2);box-shadow:var(--shadow);
  touch-action:none;user-select:none;-webkit-user-select:none;
  will-change:transform;transform-origin:50% 100%;
  transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s;
}
.card.dragging{transition:none}
.card.behind{transform:scale(.95) translateY(14px);opacity:.85}
.card.behind2{transform:scale(.9) translateY(28px);opacity:.5}
.card.fly{transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .5s}
.photo{position:absolute;inset:0}
.photo svg{width:100%;height:100%}
.card .grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(20,14,30,.85) 0%,rgba(20,14,30,.35) 35%,rgba(20,14,30,0) 60%)}
.card .info{position:absolute;left:0;right:0;bottom:0;padding:22px 22px 24px;color:#fff}
.card .name{font-size:26px;font-weight:700;display:flex;align-items:baseline;gap:8px;line-height:1.2}
.card .name .age{font-family:"Outfit",sans-serif;font-weight:500;font-size:22px;opacity:.9}
.card .meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px;font-size:13px;opacity:.92}
.card .meta span{display:inline-flex;align-items:center;gap:4px}
.card .meta svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card .bio{margin-top:10px;font-size:13.5px;line-height:1.5;opacity:.92;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.card .tags span{font-size:12px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.25)}
.card .badges{position:absolute;top:16px;left:16px;display:flex;gap:6px}
.card .badges span{font-size:11px;font-weight:600;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.9);color:var(--indigo);display:flex;align-items:center;gap:4px}
.card .badges span.on{background:var(--like);color:#fff}
.card .badges span.on i{width:6px;height:6px;border-radius:50%;background:#fff;display:block;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.3}}
.stamp{
  position:absolute;top:40px;padding:8px 16px;border:4px solid;border-radius:10px;
  font-family:"Outfit",sans-serif;font-weight:700;font-size:34px;letter-spacing:.06em;
  opacity:0;transform:rotate(-18deg);color:var(--like);left:22px;
}
.stamp.nope{left:auto;right:22px;transform:rotate(18deg);color:var(--nope)}
.stamp.star{left:50%;top:auto;bottom:140px;transform:translateX(-50%) rotate(0);color:var(--star);font-size:28px}
.actions{display:flex;justify-content:center;align-items:center;gap:18px;padding:6px 0 14px}
.actions button{
  width:58px;height:58px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;
  box-shadow:var(--shadow-sm);border:1px solid var(--line);
  transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .2s;
}
.actions button svg{width:26px;height:26px;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.actions button.small{width:46px;height:46px}
.actions button.small svg{width:20px;height:20px}
.actions button:hover{transform:scale(1.1)}
.actions button:active{transform:scale(.9)}
.actions .b-nope svg{stroke:var(--nope)}
.actions .b-like svg{stroke:var(--like)}
.actions .b-star svg{stroke:var(--star)}
.actions .b-undo svg{stroke:var(--ink3)}
.actions .b-like{width:66px;height:66px}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;color:var(--ink2);padding:30px}
.empty svg{width:56px;height:56px;stroke:var(--ink3);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.empty h3{color:var(--ink);font-size:18px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 20px;border-radius:14px;font-weight:600;background:var(--accent);color:var(--accent-ink);
  transition:transform .15s,filter .2s;
}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--bg3);color:var(--ink)}
.btn.danger{background:transparent;color:var(--nope);border:1px solid var(--line)}

/* ---------- lists ---------- */
.scroll{flex:1;overflow-y:auto;min-height:0;padding:0 16px 20px}
.section-label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin:14px 4px 8px;font-family:"Outfit",sans-serif}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{
  border-radius:20px;overflow:hidden;position:relative;aspect-ratio:3/4;background:var(--bg2);box-shadow:var(--shadow-sm);
  cursor:pointer;transition:transform .2s;
}
.tile:hover{transform:translateY(-3px)}
.tile .photo svg{width:100%;height:100%}
.tile .grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(20,14,30,.8),rgba(20,14,30,0) 55%)}
.tile .t{position:absolute;left:12px;right:12px;bottom:12px;color:#fff}
.tile .t b{font-size:16px}
.tile .t small{display:block;font-size:12px;opacity:.85}
.tile .heart{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:var(--accent);display:grid;place-items:center;box-shadow:var(--shadow-sm)}
.tile .heart svg{width:16px;height:16px;fill:#fff;stroke:none}

.row{
  display:flex;align-items:center;gap:14px;padding:12px 6px;border-radius:16px;cursor:pointer;
  transition:background .15s;
}
.row:hover{background:var(--bg3)}
.avatar{width:56px;height:56px;border-radius:50%;overflow:hidden;flex:none;position:relative}
.avatar svg{width:100%;height:100%}
.avatar.sm{width:36px;height:36px}
.avatar .dot{position:absolute;right:2px;bottom:2px;width:12px;height:12px;border-radius:50%;background:var(--like);border:2px solid var(--bg)}
.row .txt{flex:1;min-width:0}
.row .txt b{display:block;font-size:15px}
.row .txt span{display:block;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .txt span.unread{color:var(--ink);font-weight:500}
.row time{font-size:11px;color:var(--ink3);font-family:"Outfit",sans-serif}
.row .n{width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:600;display:grid;place-items:center;margin-top:4px}
.newmatches{display:flex;gap:14px;overflow-x:auto;padding:4px 4px 8px;scrollbar-width:none}
.newmatches::-webkit-scrollbar{display:none}
.newmatches .nm{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;cursor:pointer;font-size:12px;color:var(--ink2)}
.newmatches .avatar{width:64px;height:64px;border:3px solid var(--accent);padding:2px;background:var(--bg)}
.newmatches .avatar svg{border-radius:50%}
.placeholder{padding:40px 20px;text-align:center;color:var(--ink2);font-size:14px}

/* ---------- chat ---------- */
#chat{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:5}
#chat.open{display:flex;transform:translateX(0)}
.chat-top{display:flex;align-items:center;gap:10px;padding:14px 12px 10px;border-bottom:1px solid var(--line);background:var(--bg2)}
.chat-top .who b{display:block;font-size:15px}
.chat-top .who span{font-size:12px;color:var(--like)}
.msgs{flex:1;overflow-y:auto;padding:16px 16px 8px;display:flex;flex-direction:column;gap:8px}
.msgs .sys{align-self:center;font-size:12px;color:var(--ink3);background:var(--bg3);padding:6px 12px;border-radius:999px;margin:6px 0}
.bubble{max-width:78%;padding:10px 14px;border-radius:18px;font-size:14.5px;line-height:1.5;animation:rise .25s ease-out;word-break:break-word}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bubble.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px}
.bubble.them{align-self:flex-start;background:var(--bg2);border:1px solid var(--line);border-bottom-left-radius:6px}
.bubble time{display:block;font-size:10px;opacity:.6;margin-top:3px;text-align:right;font-family:"Outfit",sans-serif}
.typing{align-self:flex-start;display:flex;gap:4px;padding:12px 16px;background:var(--bg2);border:1px solid var(--line);border-radius:18px;border-bottom-left-radius:6px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink3);animation:bounce 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.composer{display:flex;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg2)}
.composer input{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:11px 16px;outline:none;transition:border-color .2s}
.composer input:focus{border-color:var(--accent)}
.composer button{width:44px;height:44px;border-radius:50%;background:var(--accent);display:grid;place-items:center;transition:transform .15s}
.composer button:active{transform:scale(.9)}
.composer button svg{width:20px;height:20px;stroke:var(--accent-ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.quick{display:flex;gap:8px;padding:0 12px 8px;overflow-x:auto;scrollbar-width:none;background:var(--bg2)}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;font-size:12.5px;padding:7px 12px;border-radius:999px;background:var(--bg3);color:var(--ink2);transition:background .15s}
.quick button:hover{background:var(--accent-soft);color:var(--ink)}

/* ---------- profile ---------- */
.me-card{display:flex;align-items:center;gap:16px;padding:8px 4px 16px}
.me-card .avatar{width:76px;height:76px}
.me-card h2{font-size:20px}
.me-card p{color:var(--ink2);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:14px 12px;text-align:center}
.stat b{display:block;font-family:"Outfit",sans-serif;font-size:26px;font-weight:600;line-height:1.1}
.stat span{font-size:11.5px;color:var(--ink2)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12.5px;color:var(--ink2);font-weight:500}
.field input,.field textarea,.field select{
  border:1px solid var(--line);background:var(--bg2);border-radius:14px;padding:11px 14px;outline:none;transition:border-color .2s;width:100%;
}
.field textarea{resize:vertical;min-height:80px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tagpick{display:flex;flex-wrap:wrap;gap:8px}
.tagpick button{font-size:13px;padding:7px 12px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);color:var(--ink2);transition:all .15s}
.tagpick button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.note{font-size:12.5px;color:var(--ink3);line-height:1.6;padding:12px 4px}
.saved{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:all .3s;pointer-events:none;z-index:30}
.saved.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- match overlay ---------- */
#match{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;padding:30px;text-align:center;color:#fff;
  background:radial-gradient(120% 80% at 50% 0%,#F58A6C 0%,#C8496E 45%,#3A3F7A 100%);}
#match.open{display:flex;animation:fadein .3s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#match .title{font-family:"Outfit",sans-serif;font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1;animation:pop .6s cubic-bezier(.34,1.56,.64,1)}
#match .sub{font-size:15px;opacity:.9}
#match .pair{display:flex;align-items:center;gap:-10px;margin:10px 0}
#match .pair .avatar{width:110px;height:110px;border:4px solid #fff;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#match .pair .avatar:first-child{animation:slideL .6s cubic-bezier(.34,1.56,.64,1)}
#match .pair .avatar:last-child{animation:slideR .6s cubic-bezier(.34,1.56,.64,1);margin-left:-18px}
@keyframes slideL{from{transform:translateX(-80px);opacity:0}}
@keyframes slideR{from{transform:translateX(80px);opacity:0}}
#match .btn{background:#fff;color:#C8496E;min-width:220px}
#match .btn.ghost{background:rgba(255,255,255,.15);color:#fff}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-10px;width:8px;height:14px;border-radius:2px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}

/* ---------- profile detail sheet ---------- */
#sheet{position:absolute;inset:0;z-index:15;display:none;background:rgba(20,14,30,.5);backdrop-filter:blur(2px)}
#sheet.open{display:block}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:88%;background:var(--bg);border-radius:28px 28px 0 0;overflow-y:auto;animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#sheet .hero{height:280px;position:relative}
#sheet .hero .photo{position:absolute;inset:0}
#sheet .hero .photo svg{width:100%;height:100%}
#sheet .hero .grad{position:absolute;inset:0;background:linear-gradient(to top,var(--bg),transparent 60%)}
#sheet .body{padding:0 22px 30px}
#sheet h2{font-size:24px;display:flex;align-items:baseline;gap:8px}
#sheet h2 .age{font-family:"Outfit",sans-serif;font-weight:500;font-size:20px;color:var(--ink2)}
#sheet .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--ink2);font-size:13.5px;margin:6px 0 14px}
#sheet .meta span{display:inline-flex;align-items:center;gap:5px}
#sheet .meta svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#sheet p{font-size:14.5px;line-height:1.7;color:var(--ink)}
#sheet .tags{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 20px}
#sheet .tags span{font-size:13px;padding:6px 12px;border-radius:999px;background:var(--bg3);color:var(--ink2)}
#sheet .close{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.9);color:#1F1B2E;display:grid;place-items:center}
#sheet .close svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
.cta-row{display:flex;gap:10px}
.cta-row .btn{flex:1}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<div id="app">

  <!-- ===== Discover ===== -->
  <section class="screen active" id="s-discover">
    <div class="top">
      <div class="brand"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.6-9.3-9A5.3 5.3 0 0 1 12 6.6a5.3 5.3 0 0 1 9.3 5.4C19 16.4 12 21 12 21z"/></svg>Tomoni</div>
      <div class="chip"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6-5.3-6-10a6 6 0 0 1 12 0c0 4.7-6 10-6 10z"/><circle cx="12" cy="11" r="2"/></svg><span id="me-area-chip">東京</span> · <span id="remain-chip" class="num">0</span>人</div>
    </div>
    <div class="deck" id="deck"></div>
    <div class="actions">

/* ================= 状態 ================= */
const KEY='tomoni_demo_v1';
const defaultState=()=>({
  me:{name:'ゆう',age:27,area:'東京',job:'会社員',bio:'休日はカフェとサウナ。おいしいものを一緒に食べに行ける人を探しています。',tags:['カフェ巡り','サウナ','映画'],hue:200},
  swiped:{},      // id -> 'like' | 'nope' | 'star'
  matches:[],     // [{id, at}]
  chats:{},       // id -> [{from:'me'|'them', text, at}]
  read:{},        // id -> true
  seenLikes:false,
  history:[]      // 直前のスワイプ（undo用）
});
let S=load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.me)return Object.assign(defaultState(),s);}catch(e){}return defaultState();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const byId=id=>USERS.find(u=>u.id===id);

/* ================= アバター（SVGイラスト） ================= */
function avatarSVG(hue,seed,name){
  const h2=(hue+40)%360, h3=(hue+300)%360;
  const skin=`hsl(${28+(seed%3)*4} 55% ${80-(seed%4)*7}%)`;
  const hair=`hsl(${(hue+200)%360} 30% ${22+(seed%3)*8}%)`;
  const cloth=`hsl(${h3} 45% 45%)`;
  const id='g'+seed;
  return `<svg viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-label="${name}のイラスト">
  <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${hue} 70% 78%)"/><stop offset="1" stop-color="hsl(${h2} 65% 62%)"/></linearGradient></defs>
  <rect width="300" height="400" fill="url(#${id})"/>
  <circle cx="${60+(seed*37)%180}" cy="${60+(seed*53)%120}" r="${70+(seed%5)*10}" fill="hsl(${h2} 80% 90%)" opacity=".35"/>
  <circle cx="${200-(seed*23)%120}" cy="${280+(seed*17)%80}" r="${50+(seed%4)*12}" fill="hsl(${hue} 80% 95%)" opacity=".3"/>
  <path d="M40 400 C40 300 90 270 150 270 C210 270 260 300 260 400 Z" fill="${cloth}"/>
  <rect x="128" y="205" width="44" height="60" rx="20" fill="${skin}"/>
  <ellipse cx="150" cy="165" rx="62" ry="72" fill="${skin}"/>
  <path d="M88 160 C85 95 130 75 150 75 C175 75 215 95 212 160 C205 130 190 120 150 120 C110 120 95 130 88 160 Z" fill="${hair}"/>
  ${seed%2? `<path d="M88 150 C80 190 84 230 92 250 C100 220 100 190 98 160 Z M212 150 C220 190 216 230 208 250 C200 220 200 190 202 160 Z" fill="${hair}"/>`:''}
  <circle cx="128" cy="170" r="5" fill="#2b2233"/><circle cx="172" cy="170" r="5" fill="#2b2233"/>
  <path d="M136 200 Q150 212 164 200" stroke="#2b2233" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <circle cx="112" cy="192" r="10" fill="hsl(${hue} 80% 70%)" opacity=".45"/><circle cx="188" cy="192" r="10" fill="hsl(${hue} 80% 70%)" opacity=".45"/>
  </svg>`;
}
const ICON={
  pin:'<svg viewBox="0 0 24 24"><path d="M12 21s-6-5.3-6-10a6 6 0 0 1 12 0c0 4.7-6 10-6 10z"/><circle cx="12" cy="11" r="2"/></svg>',
  job:'<svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
  check:'<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4L19 7"/></svg>',
  heart:'<svg viewBox="0 0 24 24"><path d="M12 21s-7-4.6-9.3-9A5.3 5.3 0 0 1 12 6.6a5.3 5.3 0 0 1 9.3 5.4C19 16.4 12 21 12 21z"/></svg>'
};

/* ================= タブ ================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let tab='discover';
$$('nav.tabs button').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));
function showTab(t){
  tab=t;
  $$('.screen').forEach(s=>s.classList.toggle('active',s.id==='s-'+t));
  $$('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));

  if(t==='messages')renderMessages();
  if(t==='profile')renderProfile();

  updateBadges();
}
function updateBadges(){
  const pending=USERS.filter(u=>u.likesYou&&!S.swiped[u.id]).length;
  const bl=$('#badge-likes');bl.hidden=!(pending&&!S.seenLikes);bl.textContent=pending;
  const unread=S.matches.filter(m=>!S.read[m.id]&&(S.chats[m.id]||[]).some(x=>x.from==='them')).length;
  const bm=$('#badge-msgs');bm.hidden=!unread;bm.textContent=unread;
}

/* ================= さがす（カードスタック） ================= */
const deck=$('#deck');
function queue(){return USERS.filter(u=>!S.swiped[u.id]);}
function renderDeck(){
  deck.innerHTML='';
  const q=queue();
  $('#remain-chip').textContent=q.length;
  $('#me-area-chip').textContent=S.me.area;
  if(!q.length){
    deck.innerHTML=`<div class="empty"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><h3>今日はここまで</h3><div>近くのユーザーを全員チェックしました。<br>明日また新しい人が表示されます。</div><button class="btn ghost" id="b-reset2">デモをリセットして最初から</button></div>`;
    $('#b-reset2').onclick=resetDemo;return;
  }
  q.slice(0,3).reverse().forEach((u,i,arr)=>{
    const pos=arr.length-1-i; // 0 = top
    const c=document.createElement('div');
    c.className='card'+(pos===1?' behind':pos===2?' behind2':'');
    c.dataset.id=u.id;
    c.innerHTML=`<div class="photo">${avatarSVG(u.hue,u.id,u.name)}</div><div class="grad"></div>
      <div class="badges">${u.online?'<span class="on"><i></i>オンライン</span>':''}${u.verified?'<span>'+ICON.check+'本人確認済</span>':''}</div>
      <div class="stamp like">LIKE</div><div class="stamp nope">NOPE</div><div class="stamp star">SUPER LIKE</div>
      <div class="info">
        <div class="name">${u.name}<span class="age">${u.age}</span></div>
        <div class="meta"><span>${ICON.pin}${u.area} · ${u.dist}km</span><span>${ICON.job}${u.job}</span></div>
        <div class="bio">${u.bio}</div>
        <div class="tags">${u.tags.map(t=>`<span>${t}</span>`).join('')}</div>
      </div>`;
    deck.appendChild(c);
    if(pos===0)attachDrag(c,u);
  });
}
function attachDrag(card,u){
  let sx=0,sy=0,dx=0,dy=0,down=false,moved=false;
  const like=card.querySelector('.stamp.like'),nope=card.querySelector('.stamp.nope'),star=card.querySelector('.stamp.star');
  card.addEventListener('pointerdown',e=>{down=true;moved=false;sx=e.clientX;sy=e.clientY;card.setPointerCapture(e.pointerId);card.classList.add('dragging');});
  card.addEventListener('pointermove',e=>{
    if(!down)return;dx=e.clientX-sx;dy=e.clientY-sy;
    if(Math.abs(dx)>4||Math.abs(dy)>4)moved=true;
    card.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/18}deg)`;
    like.style.opacity=Math.min(1,Math.max(0,dx/90));
    nope.style.opacity=Math.min(1,Math.max(0,-dx/90));
    star.style.opacity=Math.min(1,Math.max(0,(-dy-60)/90))*(Math.abs(dx)<60?1:0);
  });
  const end=e=>{
    if(!down)return;down=false;card.classList.remove('dragging');
    if(!moved){openSheet(u,true);card.style.transform='';return;}
    if(dx>110)swipe('like');
    else if(dx<-110)swipe('nope');
    else if(dy<-150&&Math.abs(dx)<60)swipe('star');
    else{card.style.transform='';like.style.opacity=nope.style.opacity=star.style.opacity=0;}
  };
  card.addEventListener('pointerup',end);card.addEventListener('pointercancel',end);
}
function swipe(kind){
  const q=queue();if(!q.length)return;
  const u=q[0];const card=deck.querySelector(`.card[data-id="${u.id}"]`);
  if(card){
    card.classList.add('fly');
    const x=kind==='like'?600:kind==='nope'?-600:0,y=kind==='star'?-800:80;
    card.style.transform=`translate(${x}px,${y}px) rotate(${x/12}deg)`;card.style.opacity='0';
    card.querySelector('.stamp.'+kind).style.opacity=1;
  }
  S.swiped[u.id]=kind;S.history.push(u.id);if(S.history.length>10)S.history.shift();
  if(kind!=='nope'&&(u.likesYou||kind==='star')){
    setTimeout(()=>createMatch(u),350);
  }
  save();
  setTimeout(renderDeck,360);updateBadges();
}
$('#b-like').onclick=()=>swipe('like');
$('#b-nope').onclick=()=>swipe('nope');
$('#b-star').onclick=()=>swipe('star');
$('#b-undo').onclick=()=>{
  const id=S.history.pop();if(!id){toast('もどせるカードがありません');return;}
  delete S.swiped[id];
  S.matches=S.matches.filter(m=>m.id!==id);delete S.chats[id];delete S.read[id];
  save();renderDeck();updateBadges();toast(byId(id).name+'さんをもどしました');
};
document.addEventListener('keydown',e=>{
  if(tab!=='discover'||$('#chat').classList.contains('open')||$('#sheet').classList.contains('open'))return;
  if(e.key==='ArrowRight')swipe('like');if(e.key==='ArrowLeft')swipe('nope');if(e.key==='ArrowUp')swipe('star');
});

/* ================= マッチ ================= */
let matchUser=null;
function createMatch(u){
  if(S.matches.some(m=>m.id===u.id))return;
  S.matches.push({id:u.id,at:Date.now()});
  S.chats[u.id]=[];save();
  matchUser=u;
  $('#m-me').innerHTML=avatarSVG(S.me.hue,99,S.me.name);
  $('#m-them').innerHTML=avatarSVG(u.hue,u.id,u.name);
  $('#m-sub').textContent=`${u.name}さんもあなたにいいねしていました`;
  const cf=$('#confetti');cf.innerHTML='';
  for(let i=0;i<40;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=['#fff','#FFD166','#F58A6C','#7FDBCA'][i%4];p.style.animationDelay=(Math.random()*.8)+'s';p.style.animationDuration=(2+Math.random()*1.5)+'s';cf.appendChild(p);}
  $('#match').classList.add('open');
  // 相手からの最初のメッセージ（少し遅れて届く）
  setTimeout(()=>{pushThem(u.id,u.opener);},4000+Math.random()*3000);
  updateBadges();
}
$('#b-match-close').onclick=()=>$('#match').classList.remove('open');
$('#b-match-chat').onclick=()=>{$('#match').classList.remove('open');openChat(matchUser.id);};

/* ================= メッセージ一覧 ================= */
function fmtTime(t){const d=new Date(t);const now=new Date();
  if(d.toDateString()===now.toDateString())return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
  return (d.getMonth()+1)+'/'+d.getDate();}
function renderMessages(){
  const list=$('#msg-list');
  if(!S.matches.length){list.innerHTML='<div class="placeholder">まだマッチがありません。<br>「さがす」でいいねを送ってみましょう。<br><small style="color:var(--ink3)">いいねタブの人はマッチしやすいです</small></div>';return;}
  const fresh=S.matches.filter(m=>!(S.chats[m.id]||[]).some(x=>x.from==='me'));
  const sorted=[...S.matches].sort((a,b)=>{const la=S.chats[a.id]?.slice(-1)[0]?.at||a.at,lb=S.chats[b.id]?.slice(-1)[0]?.at||b.at;return lb-la;});
  let html='';
  if(fresh.length){
    html+=`<div class="section-label">新しいマッチ</div><div class="newmatches">`+fresh.map(m=>{const u=byId(m.id);return `<div class="nm" data-id="${u.id}"><div class="avatar">${avatarSVG(u.hue,u.id,u.name)}</div>${u.name}</div>`}).join('')+'</div>';
  }
  html+=`<div class="section-label">トーク</div>`+sorted.map(m=>{
    const u=byId(m.id);const c=S.chats[m.id]||[];const last=c.slice(-1)[0];
    const unread=!S.read[m.id]&&c.some(x=>x.from==='them');
    const preview=last?(last.from==='me'?'あなた: ':'')+last.text:'マッチしました。メッセージを送ってみましょう';
    return `<div class="row" data-id="${u.id}"><div class="avatar">${avatarSVG(u.hue,u.id,u.name)}${u.online?'<i class="dot"></i>':''}</div>
      <div class="txt"><b>${u.name}</b><span class="${unread?'unread':''}">${preview}</span></div>
      <div style="text-align:right"><time>${fmtTime(last?last.at:m.at)}</time>${unread?'<div class="n">'+c.filter(x=>x.from==='them').length+'</div>':''}</div></div>`;
  }).join('');
  list.innerHTML=html;
  list.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>openChat(+el.dataset.id));
}

/* ================= チャット ================= */
let chatId=null,typingTimer=null;
const QUICK=['はじめまして！よろしくお願いします','プロフィール見ました。趣味が合いそうですね','今度ご飯でもどうですか？','おすすめの場所ありますか？'];
function openChat(id){
  chatId=id;const u=byId(id);
  $('#chat-avatar').innerHTML=avatarSVG(u.hue,u.id,u.name);
  $('#chat-name').textContent=u.name;
  $('#chat-status').textContent=u.online?'オンライン':'最終ログイン 2時間前';
  $('#chat-status').style.color=u.online?'var(--like)':'var(--ink3)';
  $('#quick').innerHTML=QUICK.map(q=>`<button type="button">${q}</button>`).join('');
  $('#quick').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('#msg-input').value=b.textContent;$('#msg-input').focus();});
  S.read[id]=true;save();
  renderChat();$('#chat').classList.add('open');updateBadges();
}
$('#b-back').onclick=()=>{$('#chat').classList.remove('open');chatId=null;if(tab==='messages')renderMessages();updateBadges();};
$('#b-chat-profile').onclick=()=>openSheet(byId(chatId),false);
function renderChat(){
  const box=$('#msgs');const u=byId(chatId);const c=S.chats[chatId]||[];
  const m=S.matches.find(x=>x.id===chatId);
  box.innerHTML=`<div class="sys">${fmtTime(m.at)} に ${u.name}さんとマッチしました</div>`+c.map(x=>`<div class="bubble ${x.from}">${esc(x.text)}<time>${fmtTime(x.at)}</time></div>`).join('');
  box.scrollTop=box.scrollHeight;
}
function esc(s){return s.replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));}
$('#composer').addEventListener('submit',e=>{
  e.preventDefault();const inp=$('#msg-input');const t=inp.value.trim();if(!t||!chatId)return;
  (S.chats[chatId]=S.chats[chatId]||[]).push({from:'me',text:t,at:Date.now()});
  inp.value='';save();renderChat();
  scheduleReply(chatId);
});
function scheduleReply(id){
  const u=byId(id);const c=S.chats[id];
  const mine=c.filter(x=>x.from==='me').length;
  clearTimeout(typingTimer);
  typingTimer=setTimeout(()=>{
    if(chatId===id){const t=document.createElement('div');t.className='typing';t.id='typing';t.innerHTML='<i></i><i></i><i></i>';$('#msgs').appendChild(t);$('#msgs').scrollTop=$('#msgs').scrollHeight;}
    setTimeout(()=>{
      $('#typing')?.remove();
      const pool=u.replies;const text=pool[(mine-1)%pool.length];
      pushThem(id,text);
    },1200+Math.random()*1500);
  },700+Math.random()*800);
}
function pushThem(id,text){
  (S.chats[id]=S.chats[id]||[]).push({from:'them',text,at:Date.now()});
  if(chatId===id){S.read[id]=true;renderChat();}else{S.read[id]=false;}
  save();updateBadges();if(tab==='messages'&&chatId!==id)renderMessages();
}

$('#b-theme').onclick=()=>{
  const r=document.documentElement;const cur=r.getAttribute('data-theme');
  const sysDark=matchMedia('(prefers-color-scheme: dark)').matches;
  const isDark=cur==='dark'||(!cur&&sysDark);
  r.setAttribute('data-theme',isDark?'light':'dark');
  try{localStorage.setItem(KEY+'_theme',isDark?'light':'dark');}catch(e){}
};
